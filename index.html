<script id="study-data" type="application/json">{"chapters":[{"id":"11","title":"Communication","zh":"溝通","source":"組織行為 11.pdf","description":"Functions, networks, channels, persuasion, barriers, and cultural factors.","sections":[["Functions of Communication","溝通功能",[["Definition","Communication transfers and creates shared understanding of meaning, not merely information delivery.","溝通不只是傳送資訊，而是傳遞並建立共同的意義理解。"],["Managing behavior","Organizational instructions, policies, and group norms regulate behavior.","組織指示、政策與團體規範可管理行為。"],["Feedback","Clarifies expectations, assesses performance, and identifies improvements.","釐清期望、評估績效並指出改善方向。"],["Emotion sharing","Enables people to express feelings and fulfill social needs.","讓成員表達感受並滿足社交需求。"],["Persuasion","Influences opinions, beliefs, and actions through messages.","透過訊息影響觀點、信念與行動。"],["Information exchange","Supplies information for individual and group decisions.","提供個人及團隊決策所需的資訊。"]]],["Communication Process","溝通流程",[["Sender and encoding","The sender converts ideas into symbols or language.","發送者將想法編碼成符號或語言。"],["Message and channel","The message travels through a medium such as a conversation, email, or meeting.","訊息經由對話、電子郵件或會議等管道傳遞。"],["Receiver and decoding","The receiver interprets the message; shared meaning is not guaranteed.","接收者解碼訊息，但不保證雙方理解一致。"],["Noise","Interference such as technology failures, jargon, or emotions distorts communication.","技術故障、術語與情緒等雜訊可能扭曲溝通。"],["Feedback","A receiver response confirms whether the intended message was understood.","接收者回應協助確認是否理解原本的訊息。"]]],["Direction and Networks","方向與網絡",[["Downward communication","Information flows from managers to lower levels for goals, instructions, and feedback.","主管向較低階層傳遞目標、指示與回饋。"],["Upward communication","Employees send concerns, suggestions, and performance information to higher levels.","員工向上反映問題、建議與績效資訊。"],["Lateral communication","Peers at similar organizational levels coordinate activities and exchange information.","相同階層的成員協調活動並交換資訊。"],["Chain network","Follows the formal chain of command; relatively high accuracy.","依循正式指揮鏈，準確性通常較高。"],["Wheel network","A central individual controls most communication; promotes leader emergence but reduces member satisfaction.","中央人物控制多數資訊，容易形成領導者但降低成員滿意度。"],["All-channel network","Members communicate with one another directly; participation and satisfaction tend to be high.","成員彼此直接溝通，參與及滿意度通常較高。"],["Grapevine","Informal networks spread news and rumors, sometimes providing useful signals but also risk.","非正式網絡傳遞消息與傳聞，可能有用也可能造成風險。"]]],["Modes, Channels, and Persuasion","方式、管道與說服",[["Oral communication","Rapid feedback and nonverbal cues; face-to-face interaction is often rich.","回饋快速且有非語言線索；面對面互動通常較豐富。"],["Written communication","Provides documentation and reviewable details, but offers fewer immediate social cues.","可保存及檢視紀錄，但即時社交線索較少。"],["Nonverbal communication","Facial expressions, tone, gestures, posture, and distance shape interpretation.","表情、語調、手勢、姿態與距離影響解讀。"],["Channel richness","Channels differ in immediate feedback, multiple cues, and personalization; match richness to ambiguity.","管道在即時回饋、多重線索與個人化程度上不同，應配合訊息模糊性選擇。"],["Automatic processing","Fast, superficial judgment using mental shortcuts.","利用心理捷徑快速且表面地判斷。"],["Controlled processing","Careful and effortful evaluation of arguments and evidence.","投入認知努力仔細評估論點及證據。"]]],["Barriers and Cross-Cultural Communication","障礙與跨文化溝通",[["Filtering","Deliberately shaping information to make it more favorable to a receiver.","刻意調整資訊以迎合接收者。"],["Selective perception","Interpreting communication through expectations and personal beliefs.","根據原有期待及信念解讀訊息。"],["Information overload","More incoming information than an individual can process effectively.","接收量超過個人有效處理能力。"],["Emotions, language, and silence","Emotional states, semantic differences, and withheld information can disrupt understanding.","情緒狀態、語意差異與資訊保留皆可能妨礙理解。"],["Communication apprehension and lying","Anxiety about communicating and deliberate falsehoods can reduce participation and trust.","溝通焦慮及刻意說謊可能降低參與與信任。"],["High-context culture","Relies relatively more on situational, relational, and implicit cues.","較依賴情境、關係與隱含線索。"],["Low-context culture","Relies relatively more on explicit verbal or written information.","較依賴清楚直接的口語或文字資訊。"]]]]},{"id":"12","title":"Leadership","zh":"領導","source":"組織行為12.pdf","description":"Traits, behavior, contingencies, LMX, transformation, ethics, and trust.","sections":[["Trait and Behavioral Theories","特質與行為理論",[["Definition","Leadership is influencing a group toward a vision or goals; formal authority is not required.","領導是影響團體朝願景與目標邁進，不一定需要正式職權。"],["Leadership emergence vs. effectiveness","Being seen as a leader differs from actually achieving group goals.","被視為領導者不等於真正帶領團體達成目標。"],["Big Five: extraversion","Especially assertiveness, predicts leader emergence strongly.","外向性的主張性尤其能預測領導者浮現。"],["Big Five: conscientiousness","Related to structure behaviors, effectiveness, and group performance.","盡責性與建立結構、效能及團隊績效有關。"],["Other Big Five traits","Agreeableness, emotional stability, and openness predict certain dimensions of leadership.","親和性、情緒穩定與開放性和部分領導結果有關。"],["Dark Triad and emotional intelligence","Self-awareness helps restrain harmful traits; empathy helps leaders understand followers.","自我覺察可抑制黑暗人格影響，同理心則有助理解部屬。"],["Initiating structure","Organize tasks, establish roles and goals, and emphasize standards or deadlines.","組織任務、設定職責與目標、強調標準及期限。"],["Consideration","Show mutual trust, employee respect, and sensitivity to feelings.","展現互信、對員工的尊重及對感受的重視。"]]],["Contingency Theories","權變領導理論",[["Fiedler contingency model","Match relatively fixed leader style with situational control: relations, structure, and position power.","將相對固定的風格與由成員關係、任務結構、職位權力決定的情境控制程度配對。"],["Fiedler task orientation","Low-LPC leaders tend to be more effective in highly favorable or unfavorable situations.","低 LPC 任務導向領導者在極有利或極不利情境通常較有效。"],["Fiedler relationship orientation","High-LPC leaders tend to be more effective in moderately favorable situations.","高 LPC 關係導向領導者在中度有利情境通常較有效。"],["Situational leadership","Match directing or support to followers’ ability and willingness; empirical support is inconsistent.","依部屬能力與意願調整指導及支持，實證支持並不一致。"],["Path-goal theory","Clarify a route to goals, remove obstacles, and supply support.","釐清達標路徑、移除障礙並提供支持。"],["Directive leadership","Clarifies roles and procedures, useful when tasks are ambiguous.","釐清角色與程序，特別適用工作模糊時。"],["Supportive / participative / achievement oriented","Care for welfare; invite decisions; or set challenging goals.","關心福祉、邀請參與決策，或設定挑戰目標。"],["Leader-participation model","Decision involvement depends on situational needs for quality and acceptance.","決策參與程度取決於情境對品質及接受度的需求。"]]],["Contemporary Leadership","當代領導",[["Leader-member exchange (LMX)","Leaders develop differing quality relationships; in-groups get more trust and support.","主管與不同部屬形成不同品質關係，內團體獲較多信任與支持。"],["Charismatic leadership","Strong vision, symbolic appeals, risk taking, and follower sensitivity; charisma is not inherently ethical.","強烈願景、象徵性訴求、冒險及對需求敏感；魅力不等於道德。"],["Transactional leadership","Clarifies work exchanges through contingent rewards and management by exception.","透過權變獎酬與例外管理釐清工作交換。"],["Idealized influence","Transformation through respected role modeling and mission.","以受尊敬的身教及使命引領轉換。"],["Inspirational motivation","Communicates inspiring purpose and shared expectations.","傳達鼓舞人心的目的與共同期待。"],["Intellectual stimulation","Invites followers to challenge assumptions and think creatively.","鼓勵部屬挑戰假設與創意思考。"],["Individualized consideration","Develops individual followers through coaching and mentoring.","透過個別指導及導師支持促進個人成長。"]]],["Ethics, Trust, and Mentoring","倫理、信任與指導",[["Authentic leadership","Self-awareness and actions consistent with genuinely held principles.","具自我覺察，依真正相信的原則行事。"],["Ethical leadership","Models ethical behavior and reinforces appropriate standards.","以身作則並強化合宜道德規範。"],["Servant leadership","Prioritizes follower growth, empowerment, and well-being.","優先重視部屬成長、授權及福祉。"],["Trust: ability","Skills and professional competence relevant to the relationship.","與信任關係有關的技能與專業能力。"],["Trust: benevolence","Genuine concern for the interests of the other party.","真誠關心對方利益。"],["Trust: integrity","Consistent adherence to acceptable principles.","持續遵守可接受的原則。"],["Mentoring","Career guidance and psychosocial encouragement for less-experienced colleagues.","提供職涯指導及心理社會支持。"],["Leadership attribution and substitutes","Success may be overattributed to leaders; expertise, norms, or structured tasks may substitute for certain leadership.","人們可能過度歸因成功給領導者；專業能力、規範或結構化任務有時可替代部分領導行為。"]]]]},{"id":"14","title":"Conflict and Negotiation","zh":"衝突與談判","source":"組織行為14.pdf","description":"Conflict process, handling intentions, distributive and integrative bargaining.","sections":[["Conflict Types and Loci","衝突類型與層次",[["Conflict","Begins when one party perceives threatened or harmed valued interests.","當一方認為重視的利益遭威脅或傷害，衝突便開始。"],["Functional versus dysfunctional","Conflict can support goals or disrupt team performance; outcomes depend on context.","衝突可能促進目標，也可能破壞績效，效果依情境而異。"],["Task conflict","Disagreement over task content or goals; does not invariably help performance.","對任務內容或目標的分歧，不一定能提升績效。"],["Relationship conflict","Interpersonal dislike or hostility, generally psychologically harmful.","人際反感或敵意，通常對心理造成負面影響。"],["Process conflict","Disagreement over responsibility, delegation, workflow, or how tasks get done.","對責任、分工、流程及執行方式的爭議。"],["Dyadic / intragroup / intergroup","Conflict between two people, within a group, or between groups.","雙人間、團體內部、不同團體之間的衝突。"]]],["Conflict Process and Intentions","衝突過程與處理意圖",[["Five stages","Potential opposition → cognition and personalization → intentions → behavior → outcomes.","潛在對立 → 認知與個人化 → 行為意圖 → 實際行為 → 結果。"],["Perceived vs. felt conflict","Awareness of conflict differs from emotional reaction to it.","察覺衝突與產生情緒反應是不同概念。"],["Competing","High assertiveness, low cooperativeness; satisfy own interest.","高度自我主張、低合作性，以自身利益為主。"],["Collaborating","High assertiveness and cooperation; meet both parties’ core needs.","高度主張與合作，充分兼顧雙方核心需求。"],["Avoiding","Low assertiveness and cooperation; withdraw or postpone conflict.","低主張與合作，退出或延後處理衝突。"],["Accommodating","Low assertiveness and high cooperation; put others’ needs first.","低主張、高合作，優先遷就對方。"],["Compromising","Moderate assertiveness and cooperation; mutual concessions.","中度主張與合作，雙方各退一步。"]]],["Bargaining and Negotiation","協商與談判",[["Distributive bargaining","Divides a relatively fixed pie; competitive claiming of value.","分配相對固定的利益，偏向競爭。"],["Integrative bargaining","Explores interests and trade-offs to create mutual benefit.","探索需求與交換條件，創造雙方利益。"],["Target and resistance points","The desired outcome and the least acceptable settlement.","理想目標與最低可接受條件。"],["Bargaining zone","Range within which parties’ acceptable terms can overlap.","雙方可接受條件可能重疊的談判範圍。"],["BATNA","Best Alternative to a Negotiated Agreement; feasible options improve leverage.","談判協議的最佳可行替代方案，可增加談判籌碼。"],["Anchoring","An initial offer affects later judgments and concessions.","初始開價會影響後續判斷與讓步。"],["Five steps of negotiation","Preparation → ground rules → clarification → bargaining/problem-solving → closure/implementation.","準備 → 確立規則 → 說明論證 → 協商問題解決 → 結案執行。"]]],["Individuals, Relationships, and Third Parties","個人因素、關係與第三方",[["Personality, emotion, and culture","Influence bargaining behavior and perceptions, without fully determining results.","影響談判行為與知覺，但不完全決定結果。"],["Gender and social expectations","Stereotypes can affect how negotiation behavior is interpreted.","性別刻板印象可能影響談判行為受到的評價。"],["Reputation and relationships","Integrity and repeated interaction can support trust and cooperation.","正直聲譽與重複互動有助信任及合作。"],["Mediator","Facilitates agreement but ordinarily does not impose an outcome.","促進協議，但通常不能強制指定結果。"],["Arbitrator","Has authority to impose a settlement.","有權做出具約束力的仲裁決定。"],["Conciliator","Acts as informal trusted communication link.","擔任受信任的非正式溝通橋梁。"]]]]},{"id":"16","title":"Organizational Culture","zh":"組織文化","source":"組織行為16.pdf","description":"Values, cultural frameworks, socialization, ethical and adaptive culture.","sections":[["Meaning and Cultural Frameworks","文化意義與架構",[["Organizational culture","Shared meaning, values, beliefs, and assumptions distinguishing organizations.","區分組織的共享意義、價值、信念及基本假設。"],["Culture vs. satisfaction","Culture is descriptive; job satisfaction is evaluative.","文化是描述性概念，工作滿意度是評價性概念。"],["Clan culture","Internal, flexible; affiliation, collaboration, trust, and support.","內部導向且有彈性，重視歸屬、合作、信任與支持。"],["Adhocracy culture","External, flexible; innovation, autonomy, and change.","外部導向且有彈性，重視創新、自主與變革。"],["Market culture","External, stability-oriented; competition and results.","外部導向且重視穩定，以競爭與成果為主。"],["Hierarchy culture","Internal, stability-oriented; rules, formalization, and routine.","內部導向且重視穩定，強調規則、正式化與例行程序。"],["OCP eight dimensions","Innovation, attention to detail, decisiveness, team, outcome, aggressiveness, support, rewards.","創新、重視細節、果斷、團隊、成果、積極競爭、支持及獎酬。"]]],["Culture Strength and Transmission","文化強度與傳承",[["Dominant culture","Core values shared by most organizational members.","組織大多數成員共同接受的核心價值。"],["Subcultures","Localized beliefs emerging in departments or geographic units.","部門或地區形成的局部文化。"],["Strong culture","Core values intensely held and widely shared; may also impede change.","核心價值強烈且廣泛共享，但也可能阻礙變革。"],["Stories","Founding and historical narratives demonstrate accepted values.","創辦及歷史故事呈現被接受的價值觀。"],["Rituals","Repeated activities reinforce organizational values.","重複活動強化組織價值。"],["Material symbols","Offices, uniforms, and status markers signal norms or power.","辦公場所、制服及地位象徵傳達規範或權力。"],["Language","Jargon, slogans, and special terms signal shared identity.","術語、口號及特殊用語象徵共同認同。"]]],["Culture Creation and Socialization","文化建立與社會化",[["Founders","Original beliefs, choices, role modeling, and hiring shape culture.","創辦人信念、決策、身教與聘僱塑造文化。"],["Selection and top management","Hiring and senior role modeling preserve values.","甄選與高階主管身教維持共同價值。"],["Prearrival","Newcomers hold expectations and attributes before joining.","新人到職前已有期待與特質。"],["Encounter","Newcomers compare expectations against organizational reality.","新人將原先預期與實際組織生活比較。"],["Metamorphosis","Adjust to job, team, and organizational norms.","調整並融入工作、團隊與組織規範。"],["Formal/informal, individual/collective","Different onboarding structures shape integration.","正式／非正式、個人／集體等新人訓練方式影響融入。"],["Fixed/variable, serial/random","Timing and experienced guides can be predetermined or open.","適應時程及資深指導者可固定或不固定。"],["Investiture vs. divestiture","Affirm newcomer identities versus reshape existing characteristics.","肯定新人的原有特質，或要求改變既有特質。"]]],["Functions, Liabilities, and Ethics","功能、缺點與倫理",[["Culture functions","Defines boundaries, identity, collective commitment, stability, and behavioral sense-making.","界定界線、認同、集體承諾、穩定與行為意義。"],["Culture as barrier","Can block change, diversity, and merger integration.","可能阻礙變革、多元化與併購整合。"],["Ethical culture","Role modeling, clear expectations, training, fair rewards, protected reporting.","透過身教、清楚期待、訓練、公平獎懲及安全檢舉管道建立倫理文化。"],["Positive culture","Build employee strengths, recognize achievements, and support growth.","發揮員工長處、肯定成就並支持成長。"],["Workplace spirituality","Meaningful work, purpose, community; not necessarily religious.","重視有意義的工作、使命與社群，不一定與宗教有關。"],["National culture","Local values shape how employees interpret organizational practices.","當地文化價值會影響對組織措施的理解。"]]]]},{"id":"17","title":"Organizational Change and Stress Management","zh":"組織變革與壓力管理","source":"組織行為17.pdf","description":"Change forces, resistance, Lewin, Kotter, OD, innovation, and stress.","sections":[["Change and Resistance","變革與抗拒",[["Six forces for change","Workforce, technology, economic shocks, competition, social trends, world politics.","勞動力、科技、經濟衝擊、競爭、社會趨勢及國際政治。"],["Planned change","Proactive, intentional activities improve adaptation and employee behavior.","主動且有目的的活動改善組織適應及員工行為。"],["Change agents","Managers, employees, or consultants who catalyze and manage change.","推動並管理變革的主管、員工或顧問。"],["Individual resistance","Habit, security, economic concerns, fear of unknown, selective processing.","習慣、安全需求、經濟疑慮、害怕未知及選擇性資訊處理。"],["Organizational resistance","Structural inertia, limited change focus, group inertia, threats to expertise or power.","結構慣性、變革焦點有限、團體慣性，以及對專業或權力的威脅。"],["Resistance tactics","Communication, participation, support, relationships, fairness, manipulation/cooptation, selection, coercion.","溝通、參與、支持、關係、公平、操縱／吸納、甄選與強制。"]]],["Major Change Models","主要變革模型",[["Lewin: unfreezing","Reduce forces sustaining the current state and build readiness.","降低維持現狀的阻力，建立改變準備。"],["Lewin: movement","Introduce new processes, practices, and behaviors.","導入新流程、做法與行為。"],["Lewin: refreezing","Reinforce and stabilize the adopted changes.","強化並穩定已採用的改變。"],["Kotter 1–4","Urgency → coalition → vision → communicate vision.","急迫感 → 領導聯盟 → 願景 → 傳達願景。"],["Kotter 5–8","Empower action → short-term wins → consolidate → anchor change.","授權行動 → 短期成果 → 鞏固改善 → 制度化變革。"],["Action research","Diagnosis → analysis → feedback → action → evaluation.","診斷 → 分析 → 回饋 → 行動 → 評估。"],["Organizational development","Planned interventions such as sensitivity training, survey feedback, process consultation, team building, and intergroup development.","包括敏感度訓練、問卷回饋、流程諮詢、團隊建立及團體間發展的計畫性介入。"],["Appreciative inquiry","Discovery, dream, design, destiny: build change on strengths.","發現、構想、設計、實現：以組織優勢推動變革。"]]],["Innovation and Learning","創新與組織學習",[["Paradox theory","Organizations continually balance conflicting demands rather than find a permanently fixed optimum.","組織持續平衡相互衝突的需求，而非追求永久固定的最佳狀態。"],["Innovation and idea champions","Novel approaches are developed and promoted by people who obtain support.","新方案由倡導者推動並爭取支持。"],["Learning organizations","Shared vision, assumption questioning, systems thinking, open communication, collective goals.","共同願景、反思假設、系統思考、開放溝通及集體目標。"]]],["Stress and Stress Management","壓力與壓力管理",[["Stress and strain","Stress concerns important uncertain demands; strain is the resulting adverse response.","壓力涉及重要且不確定的要求；壓力反應是由此產生的負面身心反應。"],["Challenge stressors","Workload, time pressure, responsibility may motivate but still cause strain.","工作量、時間壓力及責任可能激勵，但仍可能造成壓力反應。"],["Hindrance stressors","Politics, red tape, role ambiguity, and barriers impair goal attainment.","組織政治、繁文縟節、角色模糊及障礙妨礙達標。"],["Environmental stressors","Economic, political, and technological uncertainty.","經濟、政治與科技不確定性。"],["Organizational stressors","Task, role, interpersonal, organizational, and leadership demands.","任務、角色、人際、組織與領導要求。"],["Personal stressors","Family, financial, and individual life circumstances.","家庭、財務及個人生活情況。"],["Physiological symptoms","Fatigue, headaches, cardiovascular changes, and other bodily problems.","疲勞、頭痛、心血管變化與其他生理問題。"],["Psychological symptoms","Anxiety, dissatisfaction, emotional exhaustion, and burnout.","焦慮、不滿、情緒耗竭及倦怠。"],["Behavioral symptoms","Absenteeism, turnover, withdrawal, and reduced performance.","缺勤、離職、退縮及績效降低。"],["Individual interventions","Time management, exercise, relaxation, and social support.","時間管理、運動、放鬆及社會支持。"],["Organizational interventions","Job redesign, employee participation, clear communication, training, leave, and wellness programs.","工作重設、員工參與、清楚溝通、訓練、休假及健康促進。"]]]]}],"cases":[{"id":"0914-1","date":"09/14","num":1,"title":"3 Steps to Prepare Your Culture for AI","author":"Jared Spataro","source":"0914 Case1.pdf","dilemma":["AI deployment without cultural readiness can create fear, passive adoption, and limited organizational learning.","缺乏文化準備的 AI 導入，可能造成恐懼、被動採用與學習不足。"],"concepts":["Organizational culture","Resistance to change","Learning organization","Transformational leadership"],"takeaways":[["Choose curiosity over fear","以好奇取代恐懼"],["Embrace responsible experimentation and failure","接納負責任的實驗與合理失敗"],["Become a learn-it-all organization with clear safeguards","在明確規範下建立持續學習文化"]],"details":["The reading recommends giving employees safe opportunities to experiment, share lessons, and question new AI practices, supported by continuous training and practical guardrails.","文章建議提供安全的實驗機會，讓員工分享經驗、質疑既有做法，並結合持續訓練與清楚的安全規範。"],"applications":[["Organizational culture / 組織文化","A learning-oriented and innovation-friendly culture turns AI from a threat into an opportunity to improve work.","支持學習與創新的文化，可讓員工將 AI 從威脅重新理解為改善工作的機會。"],["Resistance to change / 變革抗拒","Communication, participation, and practical training can reduce uncertainty surrounding unfamiliar AI workflows.","溝通、參與及實際訓練有助於降低不熟悉 AI 流程所引發的不確定感。"],["Learning organization / 學習型組織","Sharing experiments and errors builds reusable knowledge instead of repeated isolated trial and error.","分享實驗及錯誤可建立可重複運用的知識，而不是讓各部門反覆摸索。"]]},{"id":"0914-2","date":"09/14","num":2,"title":"AI Adoption Is Overloading Your Middle Managers","author":"Julia Shin and Sandra J. Sucher","source":"0914 Case 2.pdf","dilemma":["Executives demand AI-driven speed while middle managers inherit quality assurance, coaching, and delivery responsibilities without corresponding support.","高層期待 AI 提速，但中階主管承受審核、指導與交付等責任，卻缺少相應支持。"],"concepts":["Role overload","Stress and resources","Organizational change","Mentoring","Misaligned incentives"],"takeaways":[["Protect learning time and share knowledge centrally","保留學習時間並集中分享知識"],["Reward coaching, quality control, and knowledge transfer","獎勵指導、品質審查與知識傳遞"],["Bridge the executive–manager reality gap","縮小高階主管與中階主管的實務認知落差"]],"details":["The authors drew on interviews in consulting firms and show that organizational support, workflow redesign, manager-specific AI training, and incentives are central to making AI useful.","作者透過顧問業訪談指出，工作流程再設計、主管專用 AI 訓練、獎勵制度與組織支持，是讓 AI 真正創造價值的關鍵。"],"applications":[["Role overload / 角色超載","AI-related review and coaching responsibilities accumulate on existing delivery work, creating excessive demands.","AI 審查及指導責任疊加原有交付工作，造成過高要求。"],["Stress and resources / 壓力與資源","Without protected time, support, and clear standards, managers are expected to cope with demands that exceed available resources.","沒有保留學習時間、支持與清楚標準時，主管必須承擔超過可用資源的工作要求。"],["Mentoring / 導師制度","Time spent checking AI output can displace the coaching necessary to develop future professional judgment.","大量時間用於檢查 AI 產出，可能排擠培養未來專業判斷力的指導工作。"]]},{"id":"0921-1","date":"09/21","num":1,"title":"Our Favorite Management Tips on Dealing with Conflict","author":"HBR Editors","source":"0921 Case 1.pdf","dilemma":["Impulsive reactions, emotional escalation, and avoidance can turn routine disagreements into destructive interpersonal conflict.","衝動反應、情緒升高與迴避，可能使一般分歧演變成破壞性的人際衝突。"],"concepts":["Task and relationship conflict","Constructive dissent","Communication barriers","Trust"],"takeaways":[["Pause and identify the actual issue before responding","回應前先停下來並辨識真正問題"],["Depersonalize disagreement and normalize respectful debate","將異議去個人化並建立尊重性討論規範"],["Practice calm, constructive inquiry and coaching","以冷靜、有建設性的提問與指導處理衝突"]],"details":["A curated set of conflict-management tips addresses civility, jealous colleagues, emotionally charged meetings, healthy team disagreement, and rotating dissenting roles.","文章彙整衝突管理技巧，包括禮貌、嫉妒同事、高情緒會議、健康異議及輪流扮演反對角色。"],"applications":[["Conflict types / 衝突類型","Disagreement about ideas may become relationship hostility if people react personally rather than discussing the underlying issue.","如果成員以個人情緒回應，原本對想法的分歧可能演變成關係敵意。"],["Communication barriers / 溝通障礙","Anger and assumptions can distort how a colleague’s message is interpreted and cause unnecessary escalation.","憤怒與先入為主的假設會扭曲對同事訊息的理解，造成不必要的升級。"],["Constructive dissent / 建設性異議","Respectful debate rules and rotating dissenting roles let groups challenge ideas without attacking people.","尊重性規範與輪流提出異議，讓團隊能挑戰想法而非攻擊人。"]]},{"id":"0921-2","date":"09/21","num":2,"title":"Formalize Escalation Procedures to Improve Decision-Making","author":"Jonathan Hughes and Gabriella Salvatore","source":"0921 Case 2.pdf","dilemma":["A pharmaceutical company’s commercial and finance leaders bypass direct resolution and escalate a proposed $450,000-plus external-agency expenditure to the CEO.","製藥公司商務與財務主管沒有先直接協商，就將超過 45 萬美元的外部代理商支出爭議呈報執行長。"],"concepts":["Process and intergroup conflict","Joint escalation","Lateral communication","Procedural fairness"],"takeaways":[["First attempt resolution and document the disagreement","先嘗試自行解決並記錄歧見"],["Escalate together, presenting both sides and evidence","共同呈報雙方觀點與證據"],["Escalate specific strategic trade-offs, then retain execution ownership","針對特定策略取捨尋求指引，並保留執行責任"]],"details":["The article proposes guidelines for when to escalate, documenting efforts, joint escalation, limited scope, managerial coaching, and learning from recurring disputes.","文章建議規範呈報時機、記錄自我解決努力、共同呈報、限制範圍、主管指導與從反覆爭議中學習。"],"applications":[["Process conflict / 程序衝突","Unclear coordination over spending decisions and consultation responsibilities provokes conflict.","支出決策及事先諮詢責任不清，會引發程序衝突。"],["Intergroup conflict / 團體間衝突","Commercial expansion priorities compete with the finance function’s controls over scarce capital.","商務擴張優先事項與財務部門有限資金的控管目標互相競爭。"],["Lateral communication / 水平溝通","Peers should speak directly, jointly document options, and escalate only unresolved higher-level trade-offs.","同儕應先直接討論、共同記錄選項，再呈報尚未解決的高層次取捨。"]]},{"id":"1005-1","date":"10/05","num":1,"title":"Don’t Let AI Flatten Your Leadership Style","author":"David Lancefield","source":"1005 Case 1.pdf","dilemma":["AI makes analysis and writing efficient but can homogenize thinking and erode leadership judgment, authentic voice, and presence.","AI 提升分析與寫作效率，卻可能使思考同質化並削弱領導判斷、真實聲音與親身參與。"],"concepts":["Authentic leadership","Leadership judgment","AI collaboration","Responsible communication"],"takeaways":[["Leader-owned decisions retain human diagnosis and accountability","領導者親自掌握診斷與高風險決策責任"],["Leader-shaped communication retains authentic voice","領導者塑造溝通意義並保留真實表達"],["Use bounded automation only where errors are manageable","只在錯誤可控的低風險工作採用有界自動化"]],"details":["The four modes are leader-owned, leader-shaped/AI-assisted, AI-enabled/human review, and AI-handled/bounded. The article warns that first AI drafts can anchor the leader’s thinking.","四種模式為領導者主導、領導者塑造與 AI 輔助、AI 執行但人類審查、以及 AI 有界自主處理；文章提醒 AI 初稿可能定錨領導者思考。"],"applications":[["Authentic leadership / 真誠型領導","A leader’s own values, judgment, and voice must remain visible in difficult communications.","困難溝通時，領導者自己的價值、判斷與聲音必須清楚呈現。"],["Leadership judgment / 領導判斷","AI can summarize evidence but should not independently define a high-stakes organizational problem.","AI 可整理證據，但不應獨自界定高風險的組織問題。"],["Responsible technology use / 負責任使用科技","Match AI autonomy to task risk and preserve human review where errors or consequences are substantial.","依任務風險決定 AI 自主程度；錯誤後果重大時應保留人類審查。"]]},{"id":"1005-2","date":"10/05","num":2,"title":"5 Ways Leaders Can Communicate Power","author":"Chris Lipp","source":"1005 Case 2.pdf","dilemma":["Leaders need to communicate authority effectively without mistaking dominance, excessive detail, or blame shifting for influence.","領導者需要有效傳達權威，卻不能將支配、過量細節或推卸責任誤認為影響力。"],"concepts":["Persuasion","Leadership influence","Accountability","Meeting facilitation"],"takeaways":[["Focus on action and think big","聚焦行動並展現宏觀思維"],["Take responsibility and assess others through questions","承擔責任並透過提問評估他人"],["Direct the spotlight by guiding group discussion","透過引導集體討論掌握焦點"]],"details":["The five techniques are focus on action, think big, take the hit, assess others, and direct the spotlight. These are about perceived power and responsible communication rather than monopolizing airtime.","五項技巧依序為聚焦行動、宏觀思考、承擔責任、評估他人及引導焦點；重點在可信的影響力，而非壟斷發言。"],"applications":[["Persuasion / 說服","A broader strategic frame explains why numerical results matter and can increase perceived managerial influence.","宏觀策略框架能說明數字結果的重要性，提高他人知覺的管理影響力。"],["Accountability / 責任承擔","Owning failures and corrective actions can demonstrate capability and support trust more than blaming others.","承擔失敗並提出改進行動，比責怪他人更能展現能力與維持信任。"],["Leadership as influence / 領導即影響","Guiding an agenda and synthesizing others’ ideas can demonstrate leadership without speaking the most.","引導議程並整合他人想法，不必成為說話最多的人也能發揮領導。"]]},{"id":"1019-1","date":"10/19","num":1,"title":"You Should Take That “Boring” Meeting","author":"Elizabeth Trinh, Nicole Thio, and Nadav Klein","source":"1019 Case 1.pdf","dilemma":["Executives underestimate the informational and relational value of routine meetings, risking disengagement and employee self-censorship.","高階主管低估例行會議的資訊與關係價值，可能因此分心並造成員工自我審查。"],"concepts":["Upward communication","Selective perception","Consideration","Trust and LMX"],"takeaways":[["Interactive conversations are often more engaging than expected","即時互動對話常比預期更有參與感"],["Disengaged leaders may miss weak signals from employees","不投入的主管可能錯失員工提供的早期訊號"],["Value a meeting by potential relationship and information benefits","應評估會議可能產生的關係與資訊價值"]],"details":["Research compares live participation with passive listening or reading and shows that engaging interaction can create unexpected interest and future willingness to converse.","研究比較即時互動與被動收聽、閱讀，發現投入對話可能帶來意料之外的興趣與後續溝通意願。"],"applications":[["Selective perception / 選擇性知覺","A dull-sounding meeting title can bias leaders into ignoring information before a conversation even begins.","看似無聊的會議名稱可能使主管在對話開始前就忽略可能重要的資訊。"],["Upward communication / 向上溝通","When an executive appears bored, employees may stop reporting weak signals and emerging problems.","主管表現出無聊時，員工可能不再向上回報早期警訊與新問題。"],["LMX and trust / LMX 與信任","Repeated attentive conversations strengthen employees’ willingness to speak candidly in the future.","持續而專注的對話有助於提升員工未來坦誠表達的意願。"]]},{"id":"1019-2","date":"10/19","num":2,"title":"How to Communicate with Your Team When Business Is Bad","author":"Rebecca Knight","source":"1019 Case 2.pdf","dilemma":["During business decline and potential layoffs, leaders must communicate uncertainty honestly without inducing panic or offering false reassurance.","營運困難、可能裁員時，主管需誠實溝通不確定性，避免恐慌與空洞保證。"],"concepts":["Crisis communication","Employee silence and grapevine","Trust","Stress management"],"takeaways":[["Communicate facts, uncertainties, and monitored indicators","傳達事實、未知事項與正在觀察的指標"],["Listen carefully and avoid promises unsupported by evidence","仔細傾聽並避免無證據的承諾"],["Model calm resilience and highlight concrete progress","示範冷靜韌性並肯定具體進展"]],"details":["Recommended practices include finding one’s footing, seeing what works, curiosity, careful responses, sticking to facts, recognizing progress, and modeling resilience.","建議包括穩定領導者心態、看見有效做法、保持好奇、謹慎回應、堅持事實、肯定進展及示範韌性。"],"applications":[["Crisis communication / 危機溝通","Providing verified facts and acknowledging uncertainty prevents misleading reassurance while offering direction.","提供可查證事實並承認未知，可避免虛假安慰，同時提供方向。"],["Grapevine and employee silence / 傳聞與員工沉默","Silence from leaders and employees creates information gaps that rumors can fill.","主管與員工的沉默會形成資訊缺口，讓傳聞填補未知。"],["Trust and stress / 信任與壓力","Consistent, empathetic explanations can preserve credibility and reduce avoidable uncertainty-related strain.","一致而有同理心的說明可維持可信度，減少因不必要的不確定性而產生的壓力。"]]}],"questions":[{"id":1,"group":"11","type":"mcq","stem":"Which of the following best describes effective communication in an organizational setting?","options":["The successful transmission of a message, regardless of whether the receiver understands it.","The transfer and understanding of meaning between a sender and a receiver.","The use of formal written channels to deliver organizational instructions.","The ability of a sender to persuade the receiver to agree with a particular viewpoint."],"answer":"B","explanation_en":"Communication involves both transmission and understanding of meaning. The sender encodes and delivers information, but success requires the receiver to decode its intended meaning. Feedback verifies comprehension. Sending a message alone, using a particular channel, or persuading someone describes only part of communication.","explanation_zh":"組織溝通包含意義的傳遞與理解。發送者編碼並傳送訊息，接收者必須正確解碼，回饋則協助確認理解。僅將訊息送出、使用某個管道或說服他人，都不足以涵蓋完整定義。"},{"id":2,"group":"11","type":"mcq","stem":"A supervisor explains an employee's performance expectations, evaluates recent progress, and provides suggestions for improvement. Which function of communication is primarily demonstrated?","options":["Emotion sharing","Persuasion","Information exchange","Feedback"],"answer":"D","explanation_en":"Feedback clarifies performance standards, evaluates progress, and explains how work can improve. Although all feedback also exchanges information, its defining feature is performance-related evaluation and guidance. The other functions describe different main purposes of communication.","explanation_zh":"回饋功能用來釐清績效標準、評估進度及提供改善指引。雖然回饋同時也是資訊交換，但題目主要涉及績效評價與指導，所以 Feedback 比較精確。"},{"id":3,"group":"11","type":"mcq","stem":"During a virtual meeting, a poor internet connection distorts a manager's instructions. The employee then repeats the instructions in their own words to confirm understanding. Which statement is correct?","options":["The internet problem represents noise, and the employee’s response provides feedback.","The internet problem represents encoding, and the response is a formal communication channel.","The internet problem represents feedback, and the employee’s response is filtering.","Both events are examples of selective perception."],"answer":"A","explanation_en":"Noise is interference that reduces message clarity, such as an unstable connection. The employee’s restatement is feedback because it lets the manager check understanding. This is an example of closing the communication loop instead of merely assuming that sending instructions was enough.","explanation_zh":"雜訊是使訊息不清楚的干擾因素，例如網路不穩定。員工重述指示屬於回饋，可讓主管確認理解是否正確。這就是閉環溝通，而非單向假設訊息已被了解。"},{"id":4,"group":"11","type":"mcq","stem":"An entry-level employee reports recurring safety concerns and suggests improvements to the department manager. Which type of organizational communication does this represent?","options":["Downward communication","Lateral communication","Upward communication","Grapevine communication"],"answer":"C","explanation_en":"Upward communication moves from a lower to a higher organizational level and conveys concerns, suggestions, and progress. Downward communication flows from supervisors to employees; lateral communication connects peers. Grapevine refers to an informal network rather than the direction of a formal report.","explanation_zh":"向上溝通是員工將問題、建議或進度傳遞給較高階主管。向下溝通相反，水平溝通發生在同一階層，而 Grapevine 則是非正式消息網絡。判斷重點是資訊傳遞方向。"},{"id":5,"group":"11","type":"mcq","stem":"A self-managed team wants all members to communicate freely with one another. The team especially values employee satisfaction and equal participation. Which communication network would be most appropriate?","options":["Chain network","Wheel network","All-channel network","Strictly centralized network"],"answer":"C","explanation_en":"In an all-channel network, members interact directly without a single center. This structure typically produces high member satisfaction and broad participation. Wheel networks centralize information and make leaders more prominent, while chain networks follow formal command relationships.","explanation_zh":"全通道網絡讓所有成員直接交流，有利於參與及滿意度。輪狀網絡由中心人物控制，鏈狀網絡遵循正式指揮鏈。題目強調共同參與與自由互動，因此選全通道。"},{"id":6,"group":"11","type":"mcq","stem":"A manager must announce a controversial restructuring plan that may affect employees' responsibilities and generate strong emotional reactions. According to channel richness theory, which communication method is generally most appropriate?","options":["A standardized written bulletin without an opportunity for questions.","An interactive face-to-face meeting.","A brief automated email containing only the final decision.","An anonymous notice posted in a common area."],"answer":"B","explanation_en":"Rich channels transmit multiple cues, enable immediate feedback, and permit personal clarification. Face-to-face interaction is appropriate for ambiguous and emotionally sensitive messages such as restructuring. Written documentation may supplement the conversation but usually should not be the only channel.","explanation_zh":"高豐富度管道可傳達表情、語調等多重線索，並讓員工即時提問。組織重整涉及模糊性與情緒反應，因此面對面會議較適合。書面資料可以補充，但不宜完全取代互動。"},{"id":7,"group":"11","type":"mcq","stem":"An employee carefully evaluates research evidence, financial projections, and logical arguments before deciding whether to support a proposed organizational policy. Which type of message processing is the employee using?","options":["Automatic processing","Filtering","Selective perception","Controlled processing"],"answer":"D","explanation_en":"Controlled processing requires conscious attention to facts, arguments, and supporting evidence. Automatic processing uses superficial shortcuts. Filtering refers to altering communicated information, while selective perception concerns interpreting it through prior beliefs. Careful analytical evaluation is controlled processing.","explanation_zh":"控制式處理需要有意識地比較證據與邏輯；自動化處理則偏向心理捷徑。Filtering 是資訊過濾，Selective Perception 是依原有期待選擇性解讀。題目明顯是控制式處理。"},{"id":8,"group":"12","type":"mcq","stem":"According to research on the Big Five personality traits, which trait is the strongest predictor of leadership emergence?","options":["Agreeableness","Emotional stability","Extraversion","Openness to experience"],"answer":"C","explanation_en":"Extraversion, especially assertiveness, is the strongest Big Five predictor of leadership emergence. Emergence concerns who is perceived as a leader and differs from effectiveness. Conscientiousness also predicts important leadership outcomes, including group performance.","explanation_zh":"外向性，尤其是積極表達與主張性，是五大人格中最能預測領導者浮現的特質。但被認為是領導者不代表實際領導有效。盡責性也與團隊績效等重要結果有關。"},{"id":9,"group":"12","type":"mcq","stem":"A supervisor establishes clear performance standards, assigns specific responsibilities, and closely monitors deadlines. Which leadership behavior from the Ohio State Studies is primarily demonstrated?","options":["Consideration","Initiating structure","Individualized consideration","Laissez-faire leadership"],"answer":"B","explanation_en":"Initiating structure organizes tasks, roles, goals, and deadlines. Consideration concerns respect and follower welfare, while individualized consideration refers to tailored coaching under transformational leadership. The dimensions of initiating structure and consideration are independent rather than opposite.","explanation_zh":"建立結構是安排任務、設定角色、目標及期限。關懷著重尊重與部屬福祉；個別化關懷則屬轉換型領導中的個人指導。建立結構與關懷是獨立構面，能同時很高。"},{"id":10,"group":"12","type":"mcq","stem":"According to Fiedler's contingency model, which statement best describes the conditions under which task-oriented leaders tend to perform most effectively?","options":["They are most effective only when situational control is moderate.","They are most effective whenever employees have high emotional intelligence.","They are most effective only when leader-member relations are poor.","They tend to perform best in highly favorable or highly unfavorable situations."],"answer":"D","explanation_en":"Fiedler links leader effectiveness to the match between relatively stable style and situational control. Low-LPC task-oriented leaders are predicted to work best in very favorable or very unfavorable settings, while high-LPC relationship-oriented leaders favor moderate conditions. Situational control comprises relations, task structure, and position power.","explanation_zh":"費德勒認為效能取決於風格與情境控制的適配。低 LPC 的任務導向主管通常在極有利或極不利情境較有效；高 LPC 關係導向主管則在中度有利情境較適合。情境控制由成員關係、任務結構與職位權力決定。"},{"id":11,"group":"12","type":"mcq","stem":"An employee is unsure how to complete an unfamiliar assignment. The manager responds by clarifying responsibilities, specifying procedures, and explaining performance expectations. According to path-goal theory, which leadership style is being used?","options":["Directive leadership","Supportive leadership","Participative leadership","Achievement-oriented leadership"],"answer":"A","explanation_en":"Path-goal theory emphasizes clarifying the route to performance and removing obstacles. Directive leaders provide specific procedures and expectations, particularly useful when work is ambiguous. Supportive leadership prioritizes well-being, participative leadership invites input, and achievement-oriented leadership emphasizes challenging goals.","explanation_zh":"路徑目標理論強調釐清達標方式並移除障礙。指示型領導會說明程序與期望，特別適用於工作模糊時；支持型重福祉、參與型重決策參與、成就導向重挑戰目標。"},{"id":12,"group":"12","type":"mcq","stem":"According to leader-member exchange (LMX) theory, employees who belong to a leader's in-group are generally more likely to experience which of the following?","options":["Lower trust and less communication with the leader.","Identical treatment and opportunities compared with all other employees.","Greater trust, attention, support, and access to certain opportunities.","Complete freedom from organizational performance requirements."],"answer":"C","explanation_en":"LMX theory describes different-quality leader-follower relationships. In-group members typically receive greater support and trust and may gain additional opportunities. Such differentiation can also create perceptions of favoritism among out-group members, so the pattern should not be confused with an ethical ideal.","explanation_zh":"LMX 指主管與部屬的交換關係品質不同。內團體通常獲得較多信任、資源及機會，但明顯差別也可能引起外團體的不公平感。這是理論描述的現象，不等於理想管理原則。"},{"id":13,"group":"12","type":"mcq","stem":"A manager encourages employees to question existing assumptions, experiment with alternative approaches, and develop innovative solutions instead of relying on established routines. Which component of transformational leadership is most clearly illustrated?","options":["Contingent reward","Intellectual stimulation","Idealized influence","Management by exception"],"answer":"B","explanation_en":"Intellectual stimulation is the transformational dimension that encourages critical thinking, creativity, and questioning assumptions. Idealized influence concerns role modeling; inspirational motivation concerns vision; individualized consideration concerns coaching. Contingent reward and exception management are transactional behaviors.","explanation_zh":"智力啟發鼓勵批判思考、創造力與挑戰假設。理想化影響是身教，鼓舞性激勵是願景，個別化關懷是指導；權變獎酬與例外管理則屬交易型領導。"},{"id":14,"group":"12","type":"mcq","stem":"A leader consistently demonstrates professional competence, shows genuine concern for employees' interests, and follows ethical principles. According to the textbook's framework, which three factors primarily contribute to the leader's perceived trustworthiness?","options":["Charisma, authority, and popularity","Extraversion, ambition, and emotional expressiveness","Position power, formalization, and task structure","Ability, benevolence, and integrity"],"answer":"D","explanation_en":"Perceived trustworthiness has three central elements: ability (relevant competence), benevolence (care for others), and integrity (adherence to acceptable principles). Followers accept vulnerability when they expect these qualities. Charisma or formal power alone does not establish trust.","explanation_zh":"可信任性包含能力（專業勝任）、善意（關心他人）與正直（遵守原則）。具備這些條件，部屬才較願意承擔信任關係中的風險。魅力或正式權力並不能單獨構成信任。"},{"id":15,"group":"14","type":"mcq","stem":"During a project meeting, two employees disagree over who should be responsible for collecting data and how the project’s tasks should be allocated. Which type of conflict does this situation best represent?","options":["Relationship conflict","Task conflict","Process conflict","Interpersonal attraction conflict"],"answer":"C","explanation_en":"Process conflict concerns how tasks are carried out, including delegation, responsibilities, and work procedures. Task conflict instead concerns work goals and content; relationship conflict concerns interpersonal hostility. Disputes over allocation may become personal if managed poorly.","explanation_zh":"程序衝突涉及工作怎麼完成，例如分工、責任及流程。任務衝突是內容或目標分歧；關係衝突則是人際敵意。工作分配爭議若處理不當，也可能轉成關係衝突。"},{"id":16,"group":"14","type":"mcq","stem":"Two departments disagree about how to allocate a limited organizational budget. The marketing department wants to increase advertising expenditure, while the operations department prioritizes equipment upgrades. What is the locus of this conflict?","options":["Dyadic conflict","Intergroup conflict","Intragroup conflict","Intrapersonal conflict"],"answer":"B","explanation_en":"Intergroup conflict occurs between separate teams or departments. Dyadic conflict concerns two individuals, and intragroup conflict takes place within one group. The conflict locus describes who is involved, while conflict type describes what the dispute is about.","explanation_zh":"不同部門間的衝突屬於團體間衝突。Dyadic 是兩人之間，Intragroup 是同一團體內部。衝突「層次」問誰與誰發生；衝突「類型」問爭議內容。"},{"id":17,"group":"14","type":"mcq","stem":"During a disagreement, an employee moves beyond merely recognizing the disagreement and begins experiencing anger, frustration, and anxiety. According to the conflict process model, this situation best illustrates which concept?","options":["Perceived conflict","Potential opposition","Conflict outcomes","Felt conflict"],"answer":"D","explanation_en":"In stage II, perceived conflict is awareness of a disagreement; felt conflict adds emotional involvement such as anxiety, hostility, or frustration. The question explicitly describes emotional reactions, not just recognition of incompatibility.","explanation_zh":"衝突第二階段中，知覺衝突是知道分歧存在；感受衝突則已出現憤怒、焦慮或挫折等情緒。題目強調情緒投入，因此選 Felt Conflict。"},{"id":18,"group":"14","type":"mcq","stem":"A manager and an employee work together to develop a solution that fully addresses both parties' important concerns. Neither party is expected to sacrifice its essential interests merely to end the disagreement. Which conflict-handling intention is illustrated?","options":["Collaborating","Avoiding","Accommodating","Competing"],"answer":"A","explanation_en":"Collaborating combines high assertiveness with high cooperativeness and seeks a solution meeting both sides’ essential concerns. Compromise usually requires partial concessions, while avoiding withdraws, accommodating yields, and competing emphasizes one’s own result.","explanation_zh":"合作解決同時有高度自我主張與合作性，目標是充分兼顧雙方核心利益。妥協通常各自讓步；迴避是退縮；遷就是優先對方；競爭則優先自身結果。"},{"id":19,"group":"14","type":"mcq","stem":"A company and its labor union are negotiating a new employment agreement. Instead of arguing only over salaries, both sides explore flexible schedules, training opportunities, and productivity incentives to develop a mutually beneficial agreement. Which bargaining strategy is most clearly demonstrated?","options":["Distributive bargaining","Hardball negotiation","Integrative bargaining","Avoidance"],"answer":"C","explanation_en":"Integrative bargaining seeks to create value by discussing multiple issues and underlying interests. Flexible scheduling, training, and incentives can enable trades beneficial to both sides. Distributive bargaining instead emphasizes claiming a portion of an assumed fixed resource.","explanation_zh":"整合性談判藉由探討多個議題與核心需求創造價值。工時、訓練及獎勵可以提供互利的交換條件；分配性談判則主要爭取固定資源中的份額。"},{"id":20,"group":"14","type":"mcq","stem":"A job applicant receives an employment offer but also has another confirmed offer from a different company. How does the second offer primarily affect the applicant's negotiation position?","options":["It eliminates the need to establish a resistance point.","It strengthens the applicant’s BATNA and may increase bargaining leverage.","It guarantees that the first employer will improve its offer.","It converts every negotiation into integrative bargaining."],"answer":"B","explanation_en":"BATNA is the best feasible alternative if a negotiated agreement fails. A confirmed alternative offer reduces dependence on the current employer and can increase bargaining leverage. It neither guarantees a better settlement nor replaces the need for an acceptable reservation point.","explanation_zh":"BATNA 是談判失敗時的最佳可行替代方案。另一個已確認的錄取降低了對目前雇主的依賴，可能增加談判籌碼，但不保證對方改善條件，也不能取代保留底線。"},{"id":21,"group":"14","type":"mcq","stem":"Two parties cannot resolve a disagreement on their own. They invite a neutral third party who has the authority to impose a binding settlement. Which role is this third party performing?","options":["Mediator","Conciliator","Informal facilitator","Arbitrator"],"answer":"D","explanation_en":"An arbitrator has authority to decide or impose a settlement. Mediators help parties voluntarily negotiate without normally imposing outcomes; conciliators act as informal communication links. Binding decision authority is the key difference.","explanation_zh":"仲裁者有權決定或指定具約束力的結果。調解者協助協商但通常不能強迫接受，協調者則為非正式溝通橋梁。關鍵字是 binding settlement。"},{"id":22,"group":"16","type":"mcq","stem":"Which statement most accurately distinguishes organizational culture from job satisfaction?","options":["Organizational culture is descriptive, whereas job satisfaction is evaluative.","Organizational culture measures employee happiness, whereas job satisfaction measures organizational rules.","Organizational culture exists only in large organizations, whereas job satisfaction exists in all organizations.","Organizational culture concerns individual personality, whereas job satisfaction concerns national values."],"answer":"A","explanation_en":"Culture describes shared perceptions, values, and assumptions: what the organization is like. Job satisfaction evaluates how employees feel about the job. Someone can accurately identify a highly competitive culture while personally disliking it.","explanation_zh":"組織文化描述組織具有哪些共享價值與特徵；工作滿意度衡量員工喜歡或不喜歡自己的工作。員工可能正確描述高競爭文化，卻對此感到不滿。"},{"id":23,"group":"16","type":"mcq","stem":"An organization emphasizes flexibility, experimentation, innovation, autonomy, and rapid adaptation to external changes. According to the competing values framework, which type of organizational culture is most consistent with these characteristics?","options":["Clan culture","Hierarchy culture","Market culture","Adhocracy culture"],"answer":"D","explanation_en":"Adhocracy combines external focus with flexibility and emphasizes innovation and autonomy. Clan is internal and flexible; market is external and stability-oriented; hierarchy is internal and stability-oriented. The combination of flexibility and external experimentation identifies adhocracy.","explanation_zh":"創新型文化具有外部導向與彈性，重視創新及自主。家族型是內部／彈性；市場型是外部／穩定；層級型是內部／穩定。因此答案為 Adhocracy。"},{"id":24,"group":"16","type":"mcq","stem":"A multinational corporation has a widely shared set of core values, but its research and development department has developed distinctive norms and practices based on its specialized work. Which statement best describes this situation?","options":["The organization cannot have a dominant culture because departmental differences exist.","The organization has a dominant culture and a departmental subculture.","The departmental culture must replace the organization’s core values.","Organizational subcultures exist only when employees reject senior management."],"answer":"B","explanation_en":"Dominant culture consists of core values shared by most members. Subcultures arise within functional or geographic units and can coexist with those common values. A departmental subculture does not necessarily undermine organizational identity.","explanation_zh":"主導文化是多數成員共有的核心價值；次文化在特定部門或地區形成。兩者可以共存，部門特殊習慣不代表一定反對整體文化。"},{"id":25,"group":"16","type":"mcq","stem":"A company repeatedly tells new employees stories about its founder's willingness to take risks and celebrates an annual ceremony honoring employees who demonstrate innovation. Which two mechanisms of cultural transmission are illustrated?","options":["Formalization and centralization","Selection and performance appraisal","Stories and rituals","Job rotation and organizational restructuring"],"answer":"C","explanation_en":"Founding narratives are stories; a regularly repeated recognition ceremony is a ritual. Both communicate and reinforce culturally valued behavior. The textbook also identifies material symbols and language as transmission mechanisms.","explanation_zh":"創辦人冒險故事屬於 Stories；每年重複舉行的創新表揚屬於 Rituals。它們共同傳達並強化文化價值；另外兩種傳遞方式是物質象徵與語言。"},{"id":26,"group":"16","type":"mcq","stem":"A new employee discovers that actual workplace practices differ substantially from the expectations formed before joining the organization. According to the three-stage socialization model, which stage is the employee experiencing?","options":["Prearrival stage","Encounter stage","Metamorphosis stage","Refreezing stage"],"answer":"B","explanation_en":"Encounter occurs after entry when newcomers compare prior expectations with actual organizational life. Prearrival precedes joining; metamorphosis concerns adaptation and integration. Refreezing belongs to Lewin’s change model, not newcomer socialization.","explanation_zh":"遭遇階段是新人到職後比較原先期待與現實的時期。到職前是 Prearrival；逐漸融入是 Metamorphosis。Refreezing 則屬 Lewin 變革理論。"},{"id":27,"group":"16","type":"mcq","stem":"Which statement about strong organizational cultures is most consistent with the textbook?","options":["Strong cultures always increase innovation and organizational adaptability.","Strong cultures eliminate all disagreements among employees.","Strong cultures necessarily produce ethical behavior.","Strong cultures can increase commitment and consistency but may also become barriers to change."],"answer":"D","explanation_en":"Strong culture means shared core values are widely and intensely held. This can increase commitment, cohesion, and consistency but can also entrench routines, exclude diversity, and resist necessary environmental adaptation. Cultural strength is not synonymous with cultural goodness.","explanation_zh":"強勢文化表示核心價值廣泛且強烈共享，能促進承諾與一致性，但也可能固化習慣、排斥多元與抗拒必要改變。文化很強不等於文化必定良好。"},{"id":28,"group":"16","type":"mcq","stem":"Which managerial practice is most likely to strengthen an ethical organizational culture?","options":["Senior leaders model ethical conduct, communicate clear standards, and consistently reward ethical behavior.","Employees are encouraged to ignore ethical problems whenever short-term profits increase.","The organization removes reporting mechanisms to prevent employees from questioning management.","Management focuses exclusively on financial performance while treating ethical standards as unrelated to organizational behavior."],"answer":"A","explanation_en":"Ethical cultures are sustained by visible ethical role models, clear expectations, consistent rewards and discipline, training, and safe reporting mechanisms. Employees judge real values by whether leadership actions align with organizational claims.","explanation_zh":"倫理文化需要領導者身教、清楚規範、一致獎懲、訓練及安全舉報制度。員工會比較主管實際行動與口頭價值是否一致，因此選 A。"},{"id":29,"group":"17","type":"mcq","stem":"A company anticipates future technological developments and proactively redesigns its workflows, introduces employee training programs, and establishes new performance goals. Which concept best describes these actions?","options":["Planned change","Reactionary change","Structural inertia","Organizational resistance"],"answer":"A","explanation_en":"Planned change is proactive, intentional, and goal-directed. It improves adaptability and employee behavior before or during environmental shifts. Reactionary change follows unexpected pressure; inertia and resistance hinder rather than define this planned initiative.","explanation_zh":"計畫性變革是主動、有意圖且有目標的活動，改善組織適應及員工行為。被動因應已發生事件較偏反應性變革；慣性與抗拒則是障礙，不是這項措施的名稱。"},{"id":30,"group":"17","type":"mcq","stem":"An organization has established detailed hiring procedures, formal rules, and standardized operating systems. Even when employees support a proposed change, these existing mechanisms make organizational adaptation difficult. Which source of resistance is best illustrated?","options":["Fear of the unknown","Individual habit","Structural inertia","Selective information processing"],"answer":"C","explanation_en":"Structural inertia arises from formal organizational mechanisms intended to preserve stability, such as rules and selection systems. Here barriers persist despite employees’ willingness, distinguishing the problem from individual habit, fear, or selective processing.","explanation_zh":"結構慣性來自為維持穩定而建立的正式規章、甄選與程序。即使員工願意改變，制度仍造成障礙，因此是組織層次而非個人習慣或害怕未知。"},{"id":31,"group":"17","type":"mcq","stem":"After implementing a new performance evaluation system, management reinforces the new procedures, integrates them into organizational policies, and rewards employees who consistently follow the updated practices. Which stage of Lewin's three-step change model is most clearly illustrated?","options":["Refreezing","Unfreezing","Movement","Diagnosis"],"answer":"A","explanation_en":"Refreezing stabilizes new practices after movement by reinforcing them through policies and rewards. Unfreezing prepares people to leave the status quo; movement implements change. Diagnosis is an action-research stage, not one of Lewin’s three steps.","explanation_zh":"再凍結是在導入新做法後，透過制度及獎勵將其穩定。解凍是準備改變，移動是實際執行；診斷則屬行動研究。題目已實施制度、正強化新狀態，因此選 A。"},{"id":32,"group":"17","type":"mcq","stem":"A manager leading a major organizational transformation creates achievable short-term goals and publicly recognizes teams that successfully complete early milestones. Which step of Kotter's eight-step change model is being applied?","options":["Establishing a sense of urgency","Generating short-term wins","Creating a guiding coalition","Anchoring change through reinforcement"],"answer":"B","explanation_en":"Kotter’s sixth step is generating and recognizing short-term wins. These milestones give evidence of progress and maintain commitment during long transformations. Urgency and coalition building begin the process; anchoring change comes at the end.","explanation_zh":"Kotter 第六步是創造並肯定短期成果，讓長期變革持續保持動力。建立急迫感與領導聯盟是前兩步，將變革制度化則在最後。"},{"id":33,"group":"17","type":"mcq","stem":"An organization seeks to improve employee engagement. Consultants first identify problems, analyze collected data, share their findings with employees, implement a change intervention, and evaluate its results. Which organizational change approach does this represent?","options":["Coercion","Appreciative inquiry only","Management by exception","Action research"],"answer":"D","explanation_en":"Action research follows diagnosis, analysis, feedback, action, and evaluation. It makes organizational change evidence-based and involves affected members in problem understanding. Appreciative inquiry focuses on strengths and aspirations but is not simply the sequence described.","explanation_zh":"行動研究依序為診斷、分析、回饋、行動及評估，強調以證據選擇改善方案並讓員工理解問題。欣賞式探詢偏重從優勢與未來願景出發，非題目所述五階段。"},{"id":34,"group":"17","type":"mcq","stem":"An employee faces a demanding but meaningful project deadline. Another employee faces unclear responsibilities, unnecessary approval procedures, and organizational politics. According to the distinction between challenge and hindrance stressors, which statement is most accurate?","options":["The deadline may be a challenge stressor, while unclear responsibilities and unnecessary procedures are hindrance stressors.","Both situations are necessarily beneficial because stress always improves performance.","Challenge stressors never produce strain, whereas hindrance stressors always cause immediate physical illness.","Hindrance stressors are primarily associated with meaningful achievement and personal development."],"answer":"A","explanation_en":"Challenge stressors such as demanding deadlines may motivate but still generate strain. Hindrance stressors such as role ambiguity, red tape, and politics obstruct goals and tend to harm outcomes. Neither category is universally safe or mechanically determines individual health.","explanation_zh":"具有挑戰性的期限可能促進動機但仍會造成壓力反應。角色模糊、繁文縟節及組織政治是阻礙型壓力源，較可能妨礙目標達成。兩者都可能造成身心負擔。"},{"id":35,"group":"17","type":"mcq","stem":"A company discovers that employee stress is largely caused by excessive workloads, unclear responsibilities, and limited participation in decisions. Which intervention would be most appropriate from an organizational stress-management perspective?","options":["Advising employees to ignore organizational problems and focus only on personal relaxation.","Increasing performance demands without providing additional resources.","Redesigning jobs, clarifying roles, improving communication, and increasing employee involvement.","Eliminating all employee feedback to reduce workplace disagreements."],"answer":"C","explanation_en":"Organizational interventions should address the sources of strain through job redesign, clarified roles, communication, and participation. Relaxation alone does not correct structural demands. When stress results from work systems, management shares responsibility for improving those conditions.","explanation_zh":"組織層次壓力管理應直接改善壓力來源，包括工作重設、職責釐清、溝通及員工參與。只要求員工放鬆無法消除結構性工作要求，因此答案 C 最完整。"},{"id":36,"group":"11","type":"tf","stem":"Communication serves several organizational functions, including managing behavior, providing feedback, sharing emotions, persuasion, and exchanging information.","options":["True","False"],"answer":"True","explanation_en":"The textbook identifies these five broad communication functions. A single interaction can perform several functions simultaneously, such as a manager delivering performance feedback while also motivating a follower.","explanation_zh":"課本列出管理行為、回饋、情緒分享、說服與資訊交換五項功能。一次互動可能同時具有多種功能，例如績效回饋也能激勵部屬。"},{"id":37,"group":"11","type":"tf","stem":"When a supervisor assigns duties and explains organizational policies to subordinates, this is an example of upward communication.","options":["True","False"],"answer":"False","explanation_en":"Instructions from a manager to followers are downward communication. Upward communication goes from employees to higher managerial levels and includes reports, feedback, and concerns.","explanation_zh":"主管將任務與政策傳達部屬屬向下溝通；向上溝通則是員工向上報告進度、問題或建議。此題顛倒資訊方向。"},{"id":38,"group":"11","type":"tf","stem":"The grapevine is an informal organizational communication network that can transmit useful information but may also spread rumors and undermine employee well-being.","options":["True","False"],"answer":"True","explanation_en":"The grapevine is informal but is not necessarily inaccurate. It can convey useful early signals while also spreading gossip or uncertainty. Managers should recognize both benefits and risks instead of assuming that unofficial communication is worthless.","explanation_zh":"非正式消息網絡未必都是假消息，也可能提供早期資訊；但傳言與不確定感也可能傷害員工。管理者應同時了解其正負面效果。"},{"id":39,"group":"11","type":"tf","stem":"Written communication is necessarily richer than face-to-face communication because written records can be permanently stored and reviewed.","options":["True","False"],"answer":"False","explanation_en":"Richness depends on immediate feedback, multiple cues, and personalization, not archival permanence. Face-to-face communication supplies nonverbal signals and rapid clarification, while written channels are often better for documentation.","explanation_zh":"豐富度重視即時回饋、多重線索與個人化，而非能否保存紀錄。面對面可傳達非語言訊息並即時澄清；書面則擅長保留資料。"},{"id":40,"group":"11","type":"tf","stem":"According to channel richness principles, communication channels that allow immediate feedback and multiple informational cues are generally more suitable for ambiguous and emotionally sensitive messages.","options":["True","False"],"answer":"True","explanation_en":"Ambiguity requires clarification and emotional cues; rich channels such as interactive meetings meet these needs. Lean channels remain efficient for routine messages. Channel selection should fit the nature of the information rather than always favor one format.","explanation_zh":"模糊、敏感的訊息需要即時澄清及情緒線索，因此互動會議通常較合適。例行通知用低豐富度管道仍可能有效；應依訊息性質選擇。"},{"id":41,"group":"11","type":"tf","stem":"Automatic processing of persuasive messages requires individuals to carefully examine the supporting evidence and consciously evaluate competing arguments.","options":["True","False"],"answer":"False","explanation_en":"Careful analysis and conscious assessment constitute controlled processing. Automatic processing uses shortcuts and limited effort. The distinction matters because different persuasive approaches work depending on receiver motivation and knowledge.","explanation_zh":"仔細檢視證據是控制式處理；自動化處理較依賴心理捷徑，使用較少認知努力。說服效果也受接收者動機與知識影響。"},{"id":42,"group":"11","type":"tf","stem":"In low-context cultures, the meaning of a message generally depends more heavily on implicit relationships and nonverbal cues than on explicit verbal information.","options":["True","False"],"answer":"False","explanation_en":"High-context cultures place relatively greater weight on context, relationships, and implicit cues. Low-context cultures rely more on explicit messages. These are general communication tendencies, not unchangeable traits of every individual.","explanation_zh":"高脈絡文化較仰賴關係、情境及隱含訊號；低脈絡文化較重直接明確的語言。這是一般文化傾向，而非每個人的固定特徵。"},{"id":43,"group":"12","type":"tf","stem":"Research on leadership traits suggests that extraversion is a stronger predictor of leadership emergence than it is of actual leadership effectiveness.","options":["True","False"],"answer":"True","explanation_en":"Extraversion, particularly assertiveness, predicts who becomes visible as a leader. Emergence and effectiveness are different outcomes; a socially prominent leader does not necessarily achieve superior group results.","explanation_zh":"外向性尤其主張性可預測誰容易被視為領導者，但領導者浮現與效能是不同結果；受到注意不代表績效一定最好。"},{"id":44,"group":"12","type":"tf","stem":"The Ohio State Studies identified initiating structure and consideration as opposite ends of a single leadership dimension, meaning that a leader cannot be high in both simultaneously.","options":["True","False"],"answer":"False","explanation_en":"Initiating structure and consideration are independent leader behavior dimensions. Leaders can be simultaneously strong at organizing tasks and caring about followers. Treating them as one continuum misrepresents the Ohio State findings.","explanation_zh":"建立結構與關懷是兩個獨立構面。主管能同時擅長安排工作及照顧部屬；將它們視為同一軸的兩端並不正確。"},{"id":45,"group":"12","type":"tf","stem":"Fiedler's contingency model assumes that leadership style is relatively stable and that leadership effectiveness depends on the match between that style and situational control.","options":["True","False"],"answer":"True","explanation_en":"Fiedler treats style as relatively enduring and examines leader-member relations, task structure, and position power. Effectiveness depends on matching the leader to the situation rather than assuming one style wins universally.","explanation_zh":"費德勒將領導風格視為相對穩定，並分析成員關係、任務結構與職位權力。效能取決於風格與情境的適配，而非一種風格適用所有場合。"},{"id":46,"group":"12","type":"tf","stem":"According to path-goal theory, directive leadership is particularly useful when followers are highly experienced and their tasks are already clearly structured.","options":["True","False"],"answer":"False","explanation_en":"Directive leadership supplies task clarity and is usually most helpful when work is ambiguous. Experienced followers with structured tasks may regard excessive direction as redundant. Leaders should adjust support to situational needs.","explanation_zh":"指示型領導在任務模糊時較有用；經驗豐富、工作已清楚的員工可能認為過度指示多餘。領導行為應配合情境需求。"},{"id":47,"group":"12","type":"tf","stem":"Leader-member exchange theory suggests that leaders may develop relationships of different quality with different subordinates, resulting in varying levels of trust, support, and access to resources.","options":["True","False"],"answer":"True","explanation_en":"LMX describes differentiated leader-follower relationships. High-quality exchanges may produce greater trust, support, and opportunities, but stark differences can contribute to perceived favoritism and unfairness.","explanation_zh":"LMX 認為主管與不同部屬建立品質不同的關係。高品質交換可能提供更多信任與機會，但差別過大也可能導致偏袒及不公平感。"},{"id":48,"group":"12","type":"tf","stem":"Charismatic leadership is inherently ethical because followers' admiration for a charismatic leader prevents the misuse of power.","options":["True","False"],"answer":"False","explanation_en":"Charisma concerns influence arising from compelling vision and symbolic or emotional appeals, not guaranteed moral conduct. Charismatic leaders can exploit devotion and suppress criticism. Ethical leadership requires integrity and responsible actions.","explanation_zh":"魅力是透過願景、象徵及情緒訴求發揮影響力，不保證道德。魅力型主管也可能濫用追隨者的忠誠。倫理領導仍需正直與負責任的行動。"},{"id":49,"group":"12","type":"tf","stem":"Individualized consideration is a component of transformational leadership that emphasizes recognizing followers' unique needs and providing personalized coaching and development opportunities.","options":["True","False"],"answer":"True","explanation_en":"Individualized consideration is one of transformational leadership’s Four I’s. It emphasizes tailored coaching and developmental attention. Intellectual stimulation instead emphasizes questioning assumptions and creativity.","explanation_zh":"個別化關懷是轉換型領導 4I 之一，重視不同員工的成長需求與個別指導。智力啟發則偏重挑戰假設與創造力。"},{"id":50,"group":"14","type":"tf","stem":"Task conflict consistently improves team performance across different occupations and organizational contexts, regardless of the level or circumstances of the disagreement.","options":["True","False"],"answer":"False","explanation_en":"The textbook emphasizes mixed evidence about task conflict’s effects. Task disagreement may stimulate evaluation in some settings but can also reduce cooperation or become interpersonal hostility. Type, degree, and team climate matter.","explanation_zh":"課本指出任務衝突的績效效果證據並不一致。某些情況促進討論，其他情況卻降低合作或演變人際敵意；衝突類型、程度及團隊氣候都重要。"},{"id":51,"group":"14","type":"tf","stem":"Relationship conflict is generally dysfunctional because interpersonal hostility can reduce trust, cooperation, and employee well-being.","options":["True","False"],"answer":"True","explanation_en":"Relationship conflict centers on personal incompatibility rather than work issues. It often undermines trust, satisfaction, and collaboration and causes psychological exhaustion. Management should keep disagreements focused on substantive issues.","explanation_zh":"關係衝突聚焦於個人不合，經常傷害信任、滿意度、合作並造成心理耗竭。團隊應讓分歧集中於工作問題，避免私人化。"},{"id":52,"group":"14","type":"tf","stem":"Process conflict concerns disagreements over how work should be accomplished, including the allocation of responsibilities, delegation of tasks, and work procedures.","options":["True","False"],"answer":"True","explanation_en":"Process conflict concerns who does what and how tasks are executed. Disputes over roles or delegation can consume time and sometimes become relationship conflicts when members feel treated unfairly.","explanation_zh":"程序衝突涉及誰負責什麼、如何執行任務。角色與委派爭議不只耗時，若成員感到分工不公也可能演變成關係衝突。"},{"id":53,"group":"14","type":"tf","stem":"Intragroup conflict refers to a disagreement between two separate departments or teams within the same organization.","options":["True","False"],"answer":"False","explanation_en":"Intragroup conflict occurs within one team. Disagreements between two separate departments are intergroup conflict. Dyadic conflict occurs between two individuals. Locus is distinct from conflict content.","explanation_zh":"團體內衝突發生於同一團隊；不同部門之間是團體間衝突；兩個人之間是雙人衝突。衝突層次與衝突內容分類不同。"},{"id":54,"group":"14","type":"tf","stem":"Collaborating is characterized by high assertiveness and high cooperativeness, whereas compromising involves moderate concern for both parties' interests.","options":["True","False"],"answer":"True","explanation_en":"Collaboration seeks to satisfy both parties’ important interests through high assertiveness and cooperation. Compromise generally requires each party to concede something, placing both dimensions near the middle.","explanation_zh":"合作解決是高度主張與高度合作，試圖充分滿足雙方需求；妥協則通常雙方各自讓步，兩構面介於中間。"},{"id":55,"group":"14","type":"tf","stem":"Distributive bargaining primarily seeks to create additional value by exploring underlying interests and developing mutually beneficial solutions.","options":["True","False"],"answer":"False","explanation_en":"This is the description of integrative bargaining. Distributive bargaining divides a relatively fixed value and emphasizes claiming one’s share. Integrative bargaining explores trade-offs and creates mutual gains.","explanation_zh":"這是整合性談判的描述。分配性談判主要分配相對固定的利益，整合性談判則探索不同需求及交換條件來創造互利成果。"},{"id":56,"group":"14","type":"tf","stem":"A negotiator with a strong and realistic BATNA generally possesses greater bargaining leverage because an acceptable alternative is available if the negotiation fails.","options":["True","False"],"answer":"True","explanation_en":"BATNA means the best feasible option if agreement cannot be reached. A strong realistic alternative reduces dependence on the current negotiation. Imagined or unavailable alternatives, however, should not be mistaken for a genuine BATNA.","explanation_zh":"BATNA 是談判失敗時最佳可行選項；強而真實的替代方案能降低依賴並提高籌碼。但想像中的選項不能當成真正的 BATNA。"},{"id":57,"group":"16","type":"tf","stem":"Organizational culture is primarily a descriptive concept, whereas job satisfaction is primarily an evaluative concept.","options":["True","False"],"answer":"True","explanation_en":"Culture describes shared organizational meanings and values; satisfaction evaluates employees’ feelings about their work. A person can accurately describe a competitive culture without enjoying it.","explanation_zh":"文化描述共同意義與組織價值；工作滿意度評價員工對工作的感受。員工可能明確看出競爭文化，但並不喜歡它。"},{"id":58,"group":"16","type":"tf","stem":"In the competing values framework, hierarchy culture emphasizes external flexibility, experimentation, and rapid innovation.","options":["True","False"],"answer":"False","explanation_en":"Hierarchy culture is internal and stability-oriented, emphasizing rules and procedures. External flexibility and experimentation characterize adhocracy. The two framework axes are internal–external and flexible–stable.","explanation_zh":"層級型文化重視內部穩定與正式程序；外部彈性、創新與實驗是 Adhocracy。競爭價值架構有內外導向與彈性穩定兩軸。"},{"id":59,"group":"16","type":"tf","stem":"A strong organizational culture necessarily promotes organizational adaptability because widely shared values eliminate resistance to change.","options":["True","False"],"answer":"False","explanation_en":"Strong culture increases cohesion and consistency but can reinforce obsolete norms. Widely shared assumptions may make adaptation harder and do not remove resistance to change. Cultural strength differs from cultural appropriateness.","explanation_zh":"強勢文化增加凝聚與一致，也可能固化過時規範，使變革更困難。價值共享不會自動消除抗拒，文化強度也不等於適切性。"},{"id":60,"group":"16","type":"tf","stem":"Organizational socialization consists of three major stages: prearrival, encounter, and metamorphosis.","options":["True","False"],"answer":"True","explanation_en":"Prearrival concerns prior expectations; encounter tests expectations against reality; metamorphosis involves integration into the job, group, and organization. Socialization affects performance, commitment, and turnover.","explanation_zh":"到職前形成期待；遭遇階段比較期待與現實；蛻變階段逐漸融入工作、團體與組織。社會化影響績效、承諾與離職。"},{"id":61,"group":"16","type":"tf","stem":"Stories, rituals, material symbols, and language are important mechanisms through which organizational culture is transmitted to employees.","options":["True","False"],"answer":"True","explanation_en":"Narratives, repeated ceremonies, physical symbols, and special vocabulary reinforce cultural priorities. Together they communicate what behavior is valued and who belongs to the organization.","explanation_zh":"故事、儀式、物質象徵與語言會強化組織重視的價值，並告訴員工哪些行為受肯定以及共同認同為何。"},{"id":62,"group":"16","type":"tf","stem":"Investiture socialization primarily attempts to strip newcomers of their existing personal characteristics and replace them with a standardized organizational identity.","options":["True","False"],"answer":"False","explanation_en":"That describes divestiture. Investiture affirms and builds on the identity and characteristics newcomers already possess, whereas divestiture seeks to reshape selected characteristics.","explanation_zh":"題目描述的是剝除式社會化。肯定式社會化重視新人原有特質；剝除式才是要求改變或去除部分既有特徵。"},{"id":63,"group":"16","type":"tf","stem":"Once an organization's founders establish its original culture, employee selection practices and senior management behavior have little influence on maintaining that culture.","options":["True","False"],"answer":"False","explanation_en":"Organizational culture is sustained through founder influence, selection, top-management actions, and socialization. Senior leaders’ everyday decisions and rewards continuously reinforce or undermine stated values.","explanation_zh":"文化維持依賴創辦人、員工甄選、高階主管行為及社會化。主管日常決策與獎懲可持續強化或破壞原有價值，因此影響很大。"},{"id":64,"group":"17","type":"tf","stem":"Planned change refers to proactive, intentional, and goal-oriented efforts designed to improve organizational adaptation and influence employee behavior.","options":["True","False"],"answer":"True","explanation_en":"Planned change proactively adjusts the organization to environmental conditions and alters behavior in support of goals. It differs from purely reactionary responses to an unforeseen crisis.","explanation_zh":"計畫性變革具有主動、意圖及目標導向，旨在提升組織適應與改變員工行為，和突發事件後的被動反應不同。"},{"id":65,"group":"17","type":"tf","stem":"Resistance to organizational change typically originates only from lower-level employees because managers are naturally more supportive of change initiatives.","options":["True","False"],"answer":"False","explanation_en":"Managers at all levels can resist when change threatens authority, expertise, or performance. Organizational routines and group norms also create resistance independent of any individual employee.","explanation_zh":"各層主管都可能因權力、專業或績效受到威脅而抗拒；組織制度與團體規範也能形成阻力，不是只有基層員工。"},{"id":66,"group":"17","type":"tf","stem":"Lewin's three-step change model consists of unfreezing, movement, and refreezing.","options":["True","False"],"answer":"True","explanation_en":"Unfreezing prepares people to leave the status quo; movement introduces new practices; refreezing reinforces stability afterward. The framework is useful but may simplify continuously changing workplaces.","explanation_zh":"解凍是打破現狀、移動是實施新做法、再凍結是強化穩定。此模型有用，但可能簡化持續變動的現實環境。"},{"id":67,"group":"17","type":"tf","stem":"In Kotter's eight-step change model, leaders should anchor new practices in organizational systems before establishing a sense of urgency or creating a guiding coalition.","options":["True","False"],"answer":"False","explanation_en":"Kotter begins with urgency and guiding coalition, then vision, communication, empowerment, wins, consolidation, and finally anchoring change. Reversing the sequence undermines readiness and support.","explanation_zh":"Kotter 先建立急迫感及領導聯盟，再建立願景、溝通、授權、短期成果、鞏固，最後才制度化。將最後一步放在最前面是錯誤的。"},{"id":68,"group":"17","type":"tf","stem":"Action research is a data-driven approach to organizational change that involves diagnosis, analysis, feedback, action, and evaluation.","options":["True","False"],"answer":"True","explanation_en":"Action research uses systematic evidence to understand problems, select interventions, and measure outcomes. Employee involvement can enhance understanding and reduce change resistance.","explanation_zh":"行動研究以證據為基礎，經診斷、分析、回饋、行動與評估，協助選擇介入方案並衡量結果；員工參與也可能減少抗拒。"},{"id":69,"group":"17","type":"tf","stem":"Because challenge stressors can sometimes improve motivation and performance, they do not produce psychological or physiological strain.","options":["True","False"],"answer":"False","explanation_en":"Challenge stressors may motivate while simultaneously generating strain. Hindrance stressors tend to impair achievement, but both types can have adverse health effects. Favorable performance effects never imply zero physiological or psychological cost.","explanation_zh":"挑戰型壓力源可能激勵同時造成身心負擔；阻礙型通常妨礙成就，但兩者都可能傷害健康。績效可能受益不代表沒有壓力反應。"},{"id":70,"group":"17","type":"tf","stem":"Organizational approaches to stress management may include job redesign, clearer communication, employee involvement, training, and wellness programs.","options":["True","False"],"answer":"True","explanation_en":"These interventions reduce stressors or strengthen coping resources. Individual exercise and relaxation can help, but organizational design and role clarity must also address demands rooted i
