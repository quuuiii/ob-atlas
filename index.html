n workplace systems.","explanation_zh":"工作重設、清楚溝通、員工參與、訓練及健康計畫可降低壓力源或增加因應資源。個人放鬆也有幫助，但不能取代制度改善。"},{"id":71,"group":"0914-1","type":"mcq","stem":"An organization is preparing to introduce generative AI. Employees express concerns about job security and hesitate to experiment with the technology. Based on the article, which managerial approach would be most appropriate?","options":["Restrict AI experimentation to senior executives until employees completely overcome their concerns.","Encourage curiosity, provide opportunities for safe experimentation, and help employees understand AI’s capabilities and limitations.","Require employees to adopt AI immediately without providing training or explaining its implications.","Focus exclusively on technological infrastructure because organizational culture has little influence on AI adoption."],"answer":"B","explanation_en":"The reading frames AI readiness as a cultural, not just technical, challenge. Curiosity, safe experimentation, and transparent explanation reduce fear and support organizational learning. Coercion or technology-only thinking overlooks the sources of resistance identified in Chapters 16 and 17.","explanation_zh":"文章強調 AI 準備度是文化與技術兼具的問題。好奇心、安全實驗及清楚說明可降低恐懼並促進學習。強制導入或只重視工具，忽略第 16、17 章所述抗拒來源。"},{"id":72,"group":"0914-1","type":"mcq","stem":"A manager wants to establish a culture that supports successful AI implementation. Employees are encouraged to experiment with new workflows, document mistakes, and share useful lessons with colleagues. Which principle from the article is best illustrated?","options":["Eliminating all failures through strict supervision.","Maintaining existing routines to avoid uncertainty.","Embracing failure through a test-and-learn approach.","Replacing collaborative learning with individual performance competition."],"answer":"C","explanation_en":"The article recommends embracing failure through responsible experimentation, documentation, and sharing. A test-and-learn culture builds organizational knowledge and prevents repeated mistakes. The goal is not careless work but learning under reasonable standards.","explanation_zh":"文章鼓勵接納合理失敗，藉由負責任的實驗、記錄與分享促進學習。測試與學習文化可以累積知識、避免重複犯錯，並非容許粗心或放棄品質控制。"},{"id":73,"group":"0914-1","type":"tf","stem":"According to the article, preparing an organization for AI is primarily a technological challenge, and fostering curiosity, experimentation, and continuous learning is unnecessary once suitable AI tools have been purchased.","options":["True","False"],"answer":"False","explanation_en":"The article directly argues that organizational culture is essential to effective AI adoption. Tools alone do not resolve fear, knowledge gaps, or resistance. It recommends curiosity, accepting useful failures, and a continuous-learning mindset with responsible guardrails.","explanation_zh":"文章明確指出文化是 AI 導入的關鍵。工具無法自行消除恐懼、知識落差與抗拒，因此需要好奇、從失敗學習、持續學習及負責任的規範。"},{"id":74,"group":"0914-2","type":"mcq","stem":"At a consulting firm, junior employees use AI to produce reports more quickly, while senior executives expect faster delivery and greater productivity. Middle managers must now verify AI-generated outputs, train employees, and maintain project quality without receiving additional resources. Which organizational behavior concept best explains their situation?","options":["Role overload resulting from increased demands and insufficient resources.","Reduced role responsibility resulting from technological automation.","Improved role clarity resulting from reduced managerial involvement.","Elimination of work stress through technological efficiency."],"answer":"A","explanation_en":"New quality-control, coaching, and delivery responsibilities accumulate on existing duties, producing role overload. Faster junior output may increase review volume rather than reduce it. From Chapter 17, excessive demands with insufficient resources can cause strain.","explanation_zh":"審查品質、指導員工與交付成果等新工作疊加在原本責任上，形成角色超載。基層產出快不一定讓主管更輕鬆；第 17 章指出過高要求且缺乏資源可能產生壓力反應。"},{"id":75,"group":"0914-2","type":"mcq","stem":"Which combination of organizational interventions is most consistent with the article's recommendations for supporting middle managers during AI adoption?","options":["Increase delivery targets, eliminate learning time, and evaluate managers only on individual output.","Allow each team to develop its own AI standards independently without organizational coordination.","Transfer all AI-related quality-control responsibilities to junior employees without managerial review.","Protect time for learning, establish shared knowledge resources, clarify AI standards, and reward coaching and knowledge transfer."],"answer":"D","explanation_en":"The article identifies informal learning, misaligned incentives, and executive-manager reality gaps. Protected learning time, reusable knowledge hubs, clear standards, and rewards for coaching address these structural problems rather than transferring burdens to individuals.","explanation_zh":"文章提出非正式學習、獎勵錯置及高層與中階主管認知落差。保留學習時間、共用知識庫、清楚標準及獎勵指導，可從制度處理問題而非轉嫁個人。"},{"id":76,"group":"0914-2","type":"tf","stem":"The article argues that productivity gains from AI automatically reduce middle managers' workload because faster junior-level output eliminates the need for managerial oversight and professional development.","options":["True","False"],"answer":"False","explanation_en":"AI-generated work still requires quality checking, professional judgment, and developmental coaching. Faster output may actually produce greater review demands. Without redesign and support, AI can overload managers and weaken future talent development.","explanation_zh":"AI 產出仍需品質審核、專業判斷與培育新人。產出越快可能使審查負擔更大；若缺乏制度支持，AI 反而會壓垮主管並削弱人才培養。"},{"id":77,"group":"0921-1","type":"mcq","stem":"An employee receives a rude email from a colleague and immediately feels angry. According to the article’s recommendations, what should the employee do first to prevent unnecessary conflict escalation?","options":["Respond immediately with an equally critical email to establish authority.","Pause, reflect on the emotional reaction, and consider the colleague’s perspective before responding.","Publicly criticize the colleague to discourage future disagreements.","Ignore the conflict permanently without examining the underlying issue."],"answer":"B","explanation_en":"Pausing helps prevent impulsive conflict escalation and makes room to consider the other person’s perspective. The article recommends recognizing emotions and identifying the real issue before taking constructive action. It does not advocate permanent avoidance or retaliation.","explanation_zh":"先暫停有助於避免衝動升高衝突，也能嘗試理解對方立場。文章建議辨識情緒、找出真正問題再採取建設性行動，而非報復或永遠迴避。"},{"id":78,"group":"0921-1","type":"mcq","stem":"A project team frequently agrees with the manager's proposals without questioning assumptions. The manager wants to encourage constructive disagreement and reduce groupthink. Which action best follows the article's guidance?","options":["Discourage employees from expressing disagreement during team meetings.","Require employees to support the first proposal presented by senior management.","Establish respectful debate rules and rotate responsibility for challenging assumptions and alternative viewpoints.","Evaluate team members primarily on their willingness to avoid interpersonal tension."],"answer":"C","explanation_en":"Constructive dissent requires respectful ground rules, thoughtful inquiry, and opportunities to challenge assumptions. Rotating dissenting roles depersonalizes disagreement and reduces groupthink. Task disagreements can inform decisions when managed without personal attacks.","explanation_zh":"建設性異議需要尊重的討論規範、深入提問與挑戰假設的機會。輪流擔任反對角色可避免個人化並降低團體迷思；工作分歧若不變成人身攻擊，有助於改善決策。"},{"id":79,"group":"0921-1","type":"tf","stem":"The article recommends eliminating all disagreement within teams because both task-related and interpersonal conflicts are necessarily harmful to organizational performance.","options":["True","False"],"answer":"False","explanation_en":"The article distinguishes productive disagreement from destructive interpersonal hostility. It recommends normalizing respectful debate, separating people from problems, and directing conflict toward shared goals. Not every disagreement is dysfunctional.","explanation_zh":"文章區分建設性異議與破壞性人際敵意，鼓勵尊重性討論、將人與問題分開並聚焦共同目標。不是所有意見分歧都具有破壞性。"},{"id":80,"group":"0921-2","type":"mcq","stem":"A pharmaceutical startup's chief commercial officer proposes spending more than $450,000 on an external agency without adequately consulting the chief financial officer. The disagreement quickly reaches the CEO. Which action would best reflect the article’s recommended conflict-escalation procedures?","options":["The two executives should first attempt to resolve the disagreement, document unresolved issues, and jointly escalate the matter when necessary.","The chief commercial officer should bypass the finance department and obtain approval directly from the CEO.","Both executives should separately approach sympathetic senior leaders to secure support for their positions.","The CEO should prohibit all future disagreements between the commercial and finance departments."],"answer":"A","explanation_en":"The article recommends attempting peer-level resolution, recording prior efforts, and jointly escalating unresolved strategic issues. Separate unilateral escalations tend to present biased information and harm relationships. Joint escalation equips leaders with a balanced account.","explanation_zh":"文章建議先同儕協商、記錄嘗試過的方案，再共同呈報未解決的策略問題。各自單方面呈報容易造成偏頗資訊與關係傷害；共同呈報有助主管掌握全貌。"},{"id":81,"group":"0921-2","type":"mcq","stem":"Two product managers disagree about whether to prioritize a faster product launch or additional improvements in product quality. They cannot resolve the strategic trade-off themselves. According to the article, which approach is most appropriate?","options":["Continue debating indefinitely because escalation always represents managerial failure.","Ask senior executives to take over every operational detail of the project.","Present only the arguments supporting the preferred option of the more senior product manager.","Jointly request guidance on the strategic decision criteria while retaining responsibility for analyzing and implementing the available options."],"answer":"D","explanation_en":"The reading recommends limiting the scope of escalation to unresolved decision criteria or trade-offs. Asking for strategic direction does not mean surrendering ownership of analysis or implementation. This supports managerial coaching and avoids burdening senior leaders with every detail.","explanation_zh":"文章主張只將未解決的決策標準或取捨交由高層協助。取得策略方向後仍應自行分析並執行，不宜讓主管全面接手。這也能培養管理者的問題解決能力。"},{"id":82,"group":"0921-2","type":"tf","stem":"Joint escalation can reduce biased information, improve mutual understanding, and help leaders make better-informed decisions by ensuring that multiple perspectives are presented together.","options":["True","False"],"answer":"True","explanation_en":"Joint escalation obliges parties to explain the problem together, including evidence and failed resolution attempts. This reduces one-sided framing, supports procedural legitimacy, and helps managers balance competing priorities. It does not guarantee agreement but improves the decision process.","explanation_zh":"共同呈報要求雙方一起說明問題、證據與先前協商過程，減少單方面詮釋，強化程序正當性並協助主管平衡不同優先事項。它不保證必然達成共識，但改善決策過程。"},{"id":83,"group":"1005-1","type":"mcq","stem":"A business-unit president uses AI to summarize quarterly financial performance. However, the AI summary emphasizes supplier costs, causing the leadership team to overlook a more important decline in profit margins resulting from customer discount arrangements. Which managerial practice would best address this problem?","options":["Allow AI-generated summaries to determine the interpretation of all future financial problems.","Remove human judgment from strategic decisions to prevent personal bias.","Form an independent preliminary diagnosis and then use AI to test assumptions, challenge conclusions, and identify missing perspectives.","Delegate all financial decisions to AI whenever the system produces internally consistent explanations."],"answer":"C","explanation_en":"The article urges leaders to preserve independent judgment and diagnose important problems before relying on AI framing. A preliminary human hypothesis can be challenged or refined with AI. Otherwise, a polished but incomplete summary may anchor the team on the wrong issue.","explanation_zh":"文章強調領導者應先自行提出問題診斷，再利用 AI 挑戰與修正假設。若完全依賴 AI 摘要的起始框架，即使文字流暢，也可能讓團隊過度聚焦錯誤原因。"},{"id":84,"group":"1005-1","type":"mcq","stem":"A CEO must deliver a sensitive speech after a difficult financial quarter. She wants to use AI without losing her authentic communication style or responsibility for the message. Which mode of AI collaboration is most appropriate?","options":["AI-handled, bounded.","Leader-shaped, AI-assisted.","Fully automated leadership communication.","AI-owned strategic decision-making."],"answer":"B","explanation_en":"The leader-shaped, AI-assisted mode allows AI to help with structure while a leader determines meaning, tone, and final words. A difficult-quarter address requires authenticity and accountability. Bounded autonomous AI is better reserved for lower-risk, easily corrected work.","explanation_zh":"領導者塑造、AI 輔助模式可讓 AI 整理架構，但由領導者決定意義、語氣與最終措辭。艱難季度的演說需要真誠與責任；有界自主處理比較適合低風險且容易修正的工作。"},{"id":85,"group":"1005-1","type":"tf","stem":"The article argues that allowing AI to draft a leader’s entire communication from the beginning cannot influence the leader’s framing, assumptions, or authentic voice as long as the leader edits the final version.","options":["True","False"],"answer":"False","explanation_en":"The article cautions that an AI first draft can anchor framing and word choices even after subsequent editing. Leaders should set intentions and core points first and use AI to organize or challenge them rather than outsource ownership of the message.","explanation_zh":"文章提醒 AI 初稿可能定錨問題框架與用字，即使後來修改也可能殘留影響。領導者應先確定溝通意圖與重點，再讓 AI 協助整理與檢視。"},{"id":86,"group":"1005-2","type":"mcq","stem":"A company's major software update causes a widespread service disruption. The CEO publicly accepts responsibility, explains corrective measures, and commits to preventing similar problems. Which communication technique from the article is most directly illustrated?","options":["Take the hit.","Think big.","Assess others.","Direct the spotlight."],"answer":"A","explanation_en":"Take the hit means accepting appropriate responsibility rather than deflecting blame. Accountability paired with remedial action can signal capability and credibility. It does not imply falsely admitting responsibility for everything outside one’s control.","explanation_zh":"Take the Hit 指承擔應負責任而非推卸。責任承擔搭配改善措施能展現能力與可信度，但不代表要承認所有無關的過錯。"},{"id":87,"group":"1005-2","type":"mcq","stem":"During a strategic planning meeting, a leader establishes the agenda, invites team members to contribute, asks clarifying questions, and summarizes their ideas into a clear action plan. According to the article, what does this behavior primarily demonstrate?","options":["A leader’s power depends on speaking longer than everyone else.","Effective leaders should avoid questioning employees during discussions.","Leaders demonstrate influence primarily by preventing employees from making decisions.","Leaders can communicate power by directing attention, structuring discussion, and guiding collective action."],"answer":"D","explanation_en":"Direct the spotlight refers to organizing the conversation and synthesizing input into action. Effective influence is not equivalent to monopolizing airtime; the leader sets direction while inviting contribution. This exemplifies leadership as collective goal influence.","explanation_zh":"引導焦點是組織討論並整合意見成行動，而不是壟斷發言。有效主管訂定方向、邀請貢獻，符合領導者影響群體朝共同目標前進的概念。"},{"id":88,"group":"1005-2","type":"tf","stem":"The article's 'Think Big' principle suggests that leaders can communicate greater power by connecting concrete performance information to broader strategic meaning instead of discussing numerical details alone.","options":["True","False"],"answer":"True","explanation_en":"Think big links metrics to a strategic narrative and a compelling larger picture. Abstract framing can signal leader-level perspective, but it should complement rather than replace sound facts and evidence.","explanation_zh":"Think Big 將具體數據連到宏觀策略意義，可展現較高層次的思考；然而宏觀框架應補充事實，而非取代可靠資料。"},{"id":89,"group":"1019-1","type":"mcq","stem":"A senior executive expects a routine operational meeting to be boring and considers mentally disengaging. Based on the research reported in the article, which conclusion is most accurate?","options":["People consistently overestimate how engaging conversations about routine topics will become.","People often underestimate the enjoyment and engagement generated by live, interactive conversations about seemingly boring topics.","The topic alone reliably predicts the usefulness and relational value of a conversation.","Passive reading and active conversation always produce identical levels of engagement."],"answer":"B","explanation_en":"The reported research found that people underestimate engagement in active live conversations about apparently boring topics. Responsiveness, questioning, and relational interaction create value beyond topic descriptions. The article does not say every meeting merits attendance.","explanation_zh":"研究指出，人們常低估看似無聊主題在即時互動時的參與感。提問、回應與關係互動能創造主題名稱無法預測的價值，但文章並不主張每場會議都必須出席。"},{"id":90,"group":"1019-1","type":"mcq","stem":"A senior executive frequently multitasks during routine employee updates. Over time, employees stop reporting minor operational problems and early warning signs because they believe the executive is uninterested. Which organizational behavior problem is most directly illustrated?","options":["Excessive downward communication caused by rigid organizational rules.","A reduction in formal authority caused by participative leadership.","Suppressed upward communication resulting from perceived leadership disengagement.","Improved communication efficiency through reduced information sharing."],"answer":"C","explanation_en":"An apparently disengaged executive can cause employee self-censorship, preventing concerns from traveling upward. Information may exist at lower levels but fail to reach decision-makers. Attentive listening supports trust and effective upward communication.","explanation_zh":"主管不投入可能使員工自我審查，不再向上呈報問題。重要資訊雖存在基層，卻無法到決策者手中；專注傾聽能支持信任與有效向上溝通。"},{"id":91,"group":"1019-1","type":"tf","stem":"The article reports that actively participating in live conversations and passively reading or listening to the same content produce essentially identical increases in engagement beyond people’s original expectations.","options":["True","False"],"answer":"False","explanation_en":"The research distinguished active conversation from passively reading a transcript or hearing a recording. People underestimated live interaction’s engagement but predicted passive exposure more accurately. The relational process, not merely content, makes the difference.","explanation_zh":"研究區分即時對話與被動讀逐字稿或聽錄音。參與者低估即時對話的吸引力，對被動接收的預測則較準確；差異在於互動過程，而非只在內容。"},{"id":92,"group":"1019-2","type":"mcq","stem":"A company's financial performance has declined, and employees are worried about possible layoffs. The manager does not yet know whether additional layoffs will occur. Which response best reflects the article's recommendations?","options":["Communicate verified facts, acknowledge uncertainty, explain what management is monitoring, and avoid promising guaranteed job security.","Promise that no employees will lose their jobs to prevent anxiety.","Refuse to discuss financial difficulties until every future outcome is certain.","Emphasize only positive news and avoid acknowledging organizational problems."],"answer":"A","explanation_en":"The article recommends grounded, empathetic communication: facts, known unknowns, meaningful indicators, and concrete next steps. False guarantees erode credibility, while silence feeds speculation. Transparency should be relevant and respectful of legitimate confidentiality.","explanation_zh":"文章建議以事實、已知未知事項、重要指標及下一步行動進行同理溝通。虛假保證傷害可信度，沉默則讓傳聞滋長。透明仍須兼顧相關性與正當保密。"},{"id":93,"group":"1019-2","type":"mcq","stem":"During a difficult business period, employees stop asking questions in team meetings. According to the article, how should the manager interpret and respond to this silence?","options":["Assume that employees are satisfied because the absence of questions demonstrates trust.","Reduce communication further because silence indicates that employees prefer limited information.","Publicly pressure every employee to express concerns immediately.","Recognize that silence does not necessarily indicate confidence and seek insights from trusted employees or informal team contacts."],"answer":"D","explanation_en":"Silence may indicate anxiety, uncertainty, or lack of safety rather than agreement. The article suggests consulting trusted informal contacts who understand team sentiment, while creating room for thoughtful questions. This addresses upward communication failure.","explanation_zh":"員工沉默可能源於焦慮、不確定或缺乏安全感，不等於認同。文章建議了解團隊心聲的可信任非正式聯絡者，並創造提問空間，以降低向上溝通失靈。"},{"id":94,"group":"1019-2","type":"tf","stem":"The article recommends that leaders remain silent during uncertainty because avoiding difficult conversations prevents employees from imagining negative outcomes.","options":["True","False"],"answer":"False","explanation_en":"Leaders’ silence can increase rumors and worst-case speculation. The article recommends calm, honest presence, acknowledging uncertainty, and showing what the team can control. Resilience does not require pretending to know every answer.","explanation_zh":"主管沉默可能增加謠言及最壞情境猜測。文章建議冷靜且誠實地持續出現、承認未知，並指出團隊能控制的事。韌性不代表假裝自己知道所有答案。"}]}</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('study-data').textContent);
const Q=DATA.questions, CH=DATA.chapters, CA=DATA.cases;
const KEY='ob-atlas-v1';
const $=s=>document.querySelector(s);const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={page:'dashboard',chapter:'11',caseId:'0914-1',lang:'both',mode:'practice',filter:'all',kind:'all',special:'all',search:'',seq:[],pos:0,submitted:false,sessionId:0,examAnswers:{}};
let saved={answers:{},revealed:{},bookmarks:[],read:[],theme:'light',lastUpdated:null};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==='object')saved={...saved,...s};}catch(e){}
function persistSession(){saved.session={page:state.page,mode:state.mode,filter:state.filter,kind:state.kind,special:state.special,seq:state.seq.slice(),pos:state.pos,submitted:state.submitted,examAnswers:{...state.examAnswers}};saved.lastUpdated=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(saved));}catch(e){console.warn('Study progress could not be saved',e)}}
function restoreSession(){let d=saved.session;if(!d||typeof d!=='object')return;const valid=new Set(Q.map(q=>q.id));state.mode=d.mode==='exam'?'exam':'practice';state.filter=typeof d.filter==='string'?d.filter:'all';state.kind=['all','mcq','tf'].includes(d.kind)?d.kind:'all';state.special=['all','wrong','unanswered','bookmarks'].includes(d.special)?d.special:'all';state.seq=Array.isArray(d.seq)?d.seq.filter(id=>valid.has(id)):[];state.pos=Math.min(Math.max(0,Number(d.pos)||0),Math.max(0,state.seq.length-1));state.submitted=!!d.submitted;state.examAnswers=d.examAnswers&&typeof d.examAnswers==='object'?d.examAnswers:{};state.page=d.page==='quiz'?'quiz':'dashboard'}
restoreSession();
function save(){persistSession();updateSide();}
function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>t.classList.remove('show'),2300)}
function updateSide(){let count=Q.filter(q=>saved.answers[q.id]!=null).length;$('#sideFraction').textContent=`${count}/94`;$('#sideBar').style.width=(count/94*100)+'%';}
function correct(q,answer){return answer===q.answer}
function isAnswered(q){return saved.answers[q.id]!=null}
function stats(qs=Q){let answered=qs.filter(isAnswered),right=answered.filter(q=>correct(q,saved.answers[q.id]));return {total:qs.length,answered:answered.length,correct:right.length,wrong:answered.length-right.length,rate:answered.length?Math.round(right.length/answered.length*100):0}}
function isBookmark(q){return saved.bookmarks.includes(q.id)}
function markToggle(q){saved.bookmarks=isBookmark(q)?saved.bookmarks.filter(x=>x!==q.id):[...saved.bookmarks,q.id];save();render()}
function btn(text,cb,cls='btn btnOutline'){return `<button class="${cls}" data-action="${cb}">${text}</button>`}
function pair(en,zh){return `<div class="english"><span class="langFlag">EN</span>${escapeHTML(en)}</div><div class="chinese"><span class="langFlag">繁中</span>${escapeHTML(zh)}</div>`}
function visiblePair(en,zh){return `${state.lang!=='zh'?`<div class="eng">${escapeHTML(en)}</div>`:''}${state.lang!=='en'?`<div class="zh">${escapeHTML(zh)}</div>`:''}`}
function header(title,subtitle,kicker='STUDY CENTER'){return `<div class="pageHead"><div class="kicker">${kicker}</div><h1>${title}</h1><p>${subtitle}</p></div>`}
function footer(){return `<div class="footer">OB Atlas · Based on five uploaded textbook chapter PDFs and eight assigned case readings · Works fully offline · Answers, exam drafts and your last question are automatically saved to this browser.<div style="margin-top:5px">Source-oriented study aid. Explanations paraphrase the assigned materials and do not replace the original PDFs.</div></div>`}
function go(page){state.page=page;$('.sidebar').classList.remove('open');$('#overlay').classList.remove('show');window.scrollTo({top:0,behavior:'instant'});render()}
function setChapter(id){state.chapter=id;go('chapters')}
function setCase(id){state.caseId=id;go('caseDetail')}
function render(){const names={dashboard:'Overview',chapters:'Chapter Review',cases:'Case Studies',caseDetail:'Case Analysis',quiz:'Question Bank',answerKey:'Answer Key',analytics:'My Progress'};$('#crumbTitle').textContent=names[state.page]||state.page;document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.go===(state.page==='caseDetail'?'cases':state.page)));document.documentElement.dataset.theme=saved.theme;$('#themeBtn').textContent=saved.theme==='dark'?'☀':'☾';let html={dashboard:renderDashboard,chapters:renderChapters,cases:renderCases,caseDetail:renderCaseDetail,quiz:renderQuiz,answerKey:renderAnswerKey,analytics:renderAnalytics}[state.page]();$('#page').innerHTML=html+footer();updateSide();persistSession();}
function renderDashboard(){let st=stats();let read=saved.read.length,totalSections=CH.reduce((a,c)=>a+c.sections.length,0);return `<div class="hero"><div class="kicker">YOUR PERSONAL STUDY SPACE / 學習工作室</div><h1 class="heroTitle">Master the <em>human side</em><br>of organizations.</h1><p class="heroDesc">Five textbook chapters. Eight real-world management readings. Ninety-four bilingual explained questions. All in one focused, offline study workspace.</p><div class="heroButtons"><button class="btn btnLight" data-go="quiz">Start practicing ↗</button><button class="btn" style="color:#fff;background:transparent;border-color:#82b4a9" data-go="chapters">Explore concepts</button></div></div>
<div class="cards3"><div class="card"><div class="sectionTag">QUESTIONS ANSWERED</div><div class="metric">${st.answered}<span class="muted" style="font-size:18px;font-weight:500"> / 94</span></div><div class="progressTrack"><div class="progressFill" style="width:${st.answered/94*100}%"></div></div></div><div class="card"><div class="sectionTag">CURRENT ACCURACY</div><div class="metric">${st.rate}%</div><div class="small muted">${st.correct} correct · ${st.wrong} incorrect</div></div><div class="card"><div class="sectionTag">REVIEW PROGRESS</div><div class="metric">${read}<span class="muted" style="font-size:18px;font-weight:500"> / ${totalSections}</span></div><div class="small muted">Chapter sections marked complete</div></div></div>
<div class="sectionTop"><div><h2>Your study map</h2><p>Pick up wherever you need the most practice.</p></div></div>
<div class="cards3"><div class="card"><div class="sectionTag">01 / CONCEPTS</div><h3>Textbook Chapters</h3><p class="small muted">Five chapters with paired English and Traditional Chinese explanations.</p><button class="dashlink" data-go="chapters">Review all chapters →</button></div><div class="card"><div class="sectionTag">02 / APPLICATION</div><h3>Eight Case Studies</h3><p class="small muted">Core dilemmas, key takeaways, and chapter connections for each reading.</p><button class="dashlink" data-go="cases">Explore cases →</button></div><div class="card"><div class="sectionTag">03 / EXAM</div><h3>Practice & Retry</h3><p class="small muted">51 multiple choice and 43 true/false questions with bilingual rationales.</p><button class="dashlink" data-go="quiz">Enter question bank →</button></div></div>
<div class="sectionTop"><div><h2>Chapter coverage</h2><p>Each textbook chapter has 14 questions in the full bank.</p></div></div><div class="cards2">${CH.map(c=>{let s=stats(Q.filter(q=>q.group===c.id));return `<div class="card"><div class="sectionTag">CHAPTER ${c.id}</div><h3 style="margin:8px 0 1px">${escapeHTML(c.title)}</h3><div class="small muted">${escapeHTML(c.zh)}</div><div class="progressTrack" style="margin:16px 0 8px"><div class="progressFill" style="width:${s.answered/s.total*100}%"></div></div><div class="tiny">${s.answered}/${s.total} answered · ${s.rate}% accuracy</div><button class="btn btnOutline btnSmall" style="margin-top:14px" data-chapter="${c.id}">Open chapter →</button></div>`}).join('')}</div>`}
function renderChapters(){let c=CH.find(x=>x.id===state.chapter)||CH[0];return header('Core Concept Review <span class="muted">/ 核心觀念</span>','Read the five assigned textbook chapters with paired English and Traditional Chinese explanations.','PART 01 / TEXTBOOK')+`<div class="tabs">${CH.map(x=>`<button class="tab ${x.id===c.id?'active':''}" data-chapter="${x.id}">Chapter ${x.id}</button>`).join('')}</div><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:18px"><div><h2 style="margin:0;font-size:25px">Ch. ${c.id}: ${escapeHTML(c.title)}</h2><div class="muted small">${escapeHTML(c.zh)} · Source: ${escapeHTML(c.source)}</div></div><div class="chiprow">${[['both','EN + 繁中'],['en','English'],['zh','繁體中文']].map(([v,t])=>`<button class="tab ${v===state.lang?'active':''}" data-lang="${v}">${t}</button>`).join('')}</div></div><div class="split"><div>${c.sections.map((s,i)=>{let k=`${c.id}-${i}`;return `<section id="section-${i}" class="notePanel"><div class="noteHeader"><div><h3>${i+1}. ${escapeHTML(s[0])}</h3><span>${escapeHTML(s[1])} · ${s[2].length} concepts</span></div><button class="btn btnSmall ${saved.read.includes(k)?'btnPrimary':'btnOutline'} sectionRead" data-markread="${k}">${saved.read.includes(k)?'✓ Reviewed':'Mark read'}</button></div><div class="noteList">${s[2].map(p=>`<div class="noteItem"><strong>${escapeHTML(p[0])}</strong>${visiblePair(p[1],p[2])}</div>`).join('')}</div></section>`}).join('')}</div><aside class="card noteIndex"><div class="sectionTag">IN THIS CHAPTER</div>${c.sections.map((s,i)=>`<button data-jump="section-${i}">${i+1}. ${escapeHTML(s[0])}</button>`).join('')}<p class="tiny muted" style="margin-top:17px">Source: ${escapeHTML(c.source)}<br>Some supplementary theories are covered elsewhere in the textbook, not in these five selected PDFs.</p><button class="btn btnPrimary" style="width:100%;margin-top:10px" data-quizgroup="${c.id}">Practice this chapter →</button></aside></div>`}
function renderCases(){return header('Case Studies <span class="muted">/ 個案分析</span>','Eight assigned management readings with dilemmas, textbook connections, and core takeaways.','PART 02 / APPLY THE THEORY')+`<div class="caseGrid">${CA.map((c,i)=>`<div class="caseCard"><div class="caseTag">${c.date} · CASE ${c.num}</div><h3>${escapeHTML(c.title)}</h3><div class="tiny" style="margin-bottom:12px">${escapeHTML(c.author)}</div><p>${escapeHTML(c.dilemma[0])}</p><p>${escapeHTML(c.dilemma[1])}</p><div class="caseLinks">${c.concepts.slice(0,3).map(x=>`<span class="chip">${escapeHTML(x)}</span>`).join('')}</div><button class="btn btnPrimary btnSmall" data-case="${c.id}">Study this case →</button></div>`).join('')}</div>`}
function renderCaseDetail(){let c=CA.find(x=>x.id===state.caseId)||CA[0];let related=Q.filter(q=>q.group===c.id);return `<div style="margin-bottom:16px"><button class="btn btnOutline btnSmall" data-go="cases">← All Case Studies</button></div>`+header(escapeHTML(c.title),`${c.date} · Case ${c.num} · ${escapeHTML(c.author)} · ${escapeHTML(c.source)}`,'CASE ANALYSIS / 個案分析')+`<div class="card caseDetail"><div class="caseTag">ASSIGNED READING · ${c.date}</div><h3>Central Dilemma / 核心問題</h3><div class="caseStatement">${pair(...c.dilemma)}</div><h3>Expanded Summary / 個案摘要</h3>${pair(...c.details)}<h3>OB Concepts Applied / 對應組織行為理論</h3><div class="chiprow">${c.concepts.map(x=>`<span class="chip">${escapeHTML(x)}</span>`).join('')}</div><h3>OB Theory Connections / 組織行為理論應用</h3><div class="noteList" style="background:var(--panel);border-radius:12px;padding:6px 16px">${c.applications.map(a=>`<div class="noteItem"><strong>${escapeHTML(a[0])}</strong><div class="eng">${escapeHTML(a[1])}</div><div class="zh">${escapeHTML(a[2])}</div></div>`).join('')}</div><h3>Key Takeaways / 關鍵啟示</h3><ol>${c.takeaways.map(t=>`<li>${pair(...t)}</li>`).join('')}</ol><div class="notice">Case questions are contextual applications of this reading. 個案題著重文章情境與課本理論的整合應用。</div><button class="btn btnPrimary" data-quizgroup="${c.id}">Practice 3 case questions →</button></div>`}
function filteredQuestions(){let x=[...Q];if(state.filter!=='all')x=x.filter(q=>state.filter==='cases'?q.id>=71:q.group===state.filter);if(state.kind!=='all')x=x.filter(q=>q.type===state.kind);if(state.special==='wrong')x=x.filter(q=>isAnswered(q)&&!correct(q,saved.answers[q.id]));if(state.special==='bookmarks')x=x.filter(isBookmark);if(state.special==='unanswered')x=x.filter(q=>!isAnswered(q));let sr=state.search.trim().toLowerCase();if(sr)x=x.filter(q=>q.stem.toLowerCase().includes(sr)||String(q.id).includes(sr));return x;}
function startSession({reset=false}={}){state.seq=filteredQuestions().map(q=>q.id);state.pos=0;state.submitted=false;state.sessionId++;state.examAnswers={};if(reset){state.seq.forEach(id=>{delete saved.answers[id];delete saved.revealed[id]});save()}}
function currentQ(){let id=state.seq[state.pos];return Q.find(q=>q.id===id)}
function quizFilters(){return `<div class="filterBar"><div class="field"><label>CONTENT / 範圍</label><select id="groupFilter"><option value="all" ${state.filter==='all'?'selected':''}>All 94 Questions</option>${CH.map(c=>`<option value="${c.id}" ${state.filter===c.id?'selected':''}>Chapter ${c.id} · ${escapeHTML(c.title)}</option>`).join('')}<option value="cases" ${state.filter==='cases'?'selected':''}>All Case Studies (24)</option>${CA.map(c=>`<option value="${c.id}" ${state.filter===c.id?'selected':''}>${c.date} Case ${c.num} · ${escapeHTML(c.title)}</option>`).join('')}</select></div><div class="field"><label>QUESTION TYPE / 題型</label><select id="kindFilter"><option value="all" ${state.kind==='all'?'selected':''}>MCQ + True / False</option><option value="mcq" ${state.kind==='mcq'?'selected':''}>Multiple Choice Only</option><option value="tf" ${state.kind==='tf'?'selected':''}>True / False Only</option></select></div><div class="field"><label>REVIEW FILTER / 複習篩選</label><select id="specialFilter"><option value="all" ${state.special==='all'?'selected':''}>All Questions</option><option value="wrong" ${state.special==='wrong'?'selected':''}>Previously Incorrect</option><option value="unanswered" ${state.special==='unanswered'?'selected':''}>Unanswered Questions</option><option value="bookmarks" ${state.special==='bookmarks'?'selected':''}>Bookmarked Questions</option></select></div></div>`}
function renderQuiz(){if(!state.seq.length)startSession();let q=currentQ(),n=state.seq.length,answered=state.seq.filter(id=>(state.mode==='exam'?state.examAnswers[id]:saved.answers[id])!=null).length;let mode=state.mode==='practice'?'Practice mode · 即時練習':'Exam mode · 模擬考試';let h=header('Question Bank <span class="muted">/ 互動題庫</span>','94 questions with full English stems and options; every answer includes an English + Traditional Chinese academic rationale.','PART 03 / ACTIVE RECALL')+quizFilters()+`<div class="modebar"><div class="chiprow"><button class="tab ${state.mode==='practice'?'active':''}" data-mode="practice">✎ Practice Mode</button><button class="tab ${state.mode==='exam'?'active':''}" data-mode="exam">▧ Exam Mode</button></div><div class="chiprow"><span class="chip">${mode}</span><span class="chip">${n} selected</span><button class="btn btnOutline btnSmall" data-action="shuffle">↝ Shuffle</button></div></div>`;
if(!n)return h+`<div class="empty"><h3>No matching questions found</h3><p>Try changing the filters, or answer some questions first to populate your incorrect-answer list.</p><button class="btn btnPrimary" data-action="resetfilters">Show all questions</button></div>`;
if(state.submitted)return h+renderResults();
let reveal=state.mode==='practice'&&!!saved.revealed[q.id];let sel=state.mode==='exam'?state.examAnswers[q.id]:saved.answers[q.id];let from=state.pos+1;let options=q.type==='mcq'?q.options.map((t,i)=>({key:'ABCD'[i],text:t})):q.options.map(t=>({key:t,text:t}));let result=options.map(o=>{let c=reveal&&o.key===q.answer?'correct':reveal&&sel===o.key&&sel!==q.answer?'wrong':sel===o.key?'selected':'';return `<button class="answerOption ${c}" ${reveal?'disabled':''} data-answer="${escapeHTML(o.key)}"><span class="answerLetter">${escapeHTML(o.key==='True'?'T':o.key==='False'?'F':o.key)}</span><span>${escapeHTML(o.text)}</span></button>`}).join('');
let exp=reveal?`<div class="expPanel"><div class="correctLabel">✓ Correct answer: ${q.answer}</div><div style="margin-top:9px">${sel===q.answer?'<span class="chip" style="color:var(--good)">Correct / 答對了</span>':`<span class="chip" style="color:var(--danger)">Incorrect / 答錯了</span>`}</div><p><b>Academic Explanation (English)</b><br>${escapeHTML(q.explanation_en)}</p><p class="zhExp"><b>學術解析（繁體中文）</b><br>${escapeHTML(q.explanation_zh)}</p></div>`:'';
let qa=`<div class="quizFrame"><article class="quizCard"><div class="qmeta"><div style="display:flex;align-items:center;gap:10px"><span class="numberCircle">Q${q.id}</span><span class="chip">${q.id<=70?'Chapter '+q.group:'Case '+q.group}</span><span class="chip">${q.type==='mcq'?'Multiple Choice':'True / False'}</span></div><button class="iconbtn" data-bookmark="${q.id}" title="Bookmark question" aria-label="Bookmark question" style="color:${isBookmark(q)?'var(--brand)':'var(--muted)'}">${isBookmark(q)?'★':'☆'}</button></div><div class="tiny">QUESTION ${from} OF ${n} · <b>${answered}</b> answered</div><div class="progressTrack" style="margin-top:8px"><div class="progressFill" style="width:${answered/n*100}%"></div></div><div class="questionStem">${escapeHTML(q.stem)}</div><div class="options">${result}</div>${exp}<div class="quizActions"><div class="actionGroup"><button class="btn btnOutline btnSmall" data-action="prev" ${state.pos===0?'disabled':''}>← Previous</button><button class="btn btnOutline btnSmall" data-action="next" ${state.pos>=n-1?'disabled':''}>Next →</button></div><div class="actionGroup">${state.mode==='practice'&&!reveal?`<button class="btn btnPrimary btnSmall" data-action="reveal" ${sel==null?'disabled':''}>Check answer / 顯示解析</button>`:''}${state.mode==='exam'?`<button class="btn btnPrimary btnSmall" data-action="finish">Finish exam (${answered}/${n})</button>`:''}</div></div></article><aside class="qNav"><h3>Question navigator</h3><div class="tiny">${answered} / ${n} answered</div><div class="qGrid">${state.seq.map((id,i)=>{let qq=Q.find(q=>q.id===id);let miss=state.mode==='practice'&&saved.revealed[id]&&!correct(qq,saved.answers[id]);return `<button class="qIndex ${state.pos===i?'current':''} ${(state.mode==='exam'?state.examAnswers[id]:saved.answers[id])!=null?'answered':''} ${miss?'missed':''}" data-pos="${i}" aria-label="Go to question ${id}">${id}</button>`}).join('')}</div><div class="tiny">● Answered · Red = previously checked incorrect<br>Grey = unanswered</div><div style="display:grid;gap:8px;margin-top:19px"><button class="btn btnOutline btnSmall" data-action="reset-session">Clear selected answers</button><button class="btn btnOutline btnSmall" data-go="analytics">View study progress</button></div></aside></div>`;return h+qa;}
function renderResults(){let qs=state.seq.map(id=>Q.find(q=>q.id===id));let graded=qs.filter(q=>state.examAnswers[q.id]!=null),right=graded.filter(q=>correct(q,state.examAnswers[q.id]));let s={total:qs.length,answered:graded.length,correct:right.length,wrong:graded.length-right.length,rate:graded.length?Math.round(right.length/graded.length*100):0};return `<div class="card" style="text-align:center;padding:35px"><div class="kicker">SESSION COMPLETE / 測驗完成</div><h2 style="font-size:52px;margin:5px">${s.rate}%</h2><div class="muted">${s.correct} correct · ${s.wrong} incorrect · ${s.total-s.answered} unanswered</div><div class="progressTrack" style="max-width:400px;margin:20px auto"><div class="progressFill" style="width:${s.rate}%"></div></div><div class="chiprow" style="justify-content:center"><button class="btn btnPrimary" data-action="restart">Retry selected questions</button><button class="btn btnOutline" data-action="practice-wrong">Practice incorrect answers</button></div></div><div class="sectionTop"><div><h2>Answer review</h2><p>Study the reasoning behind every answer.</p></div></div>${qs.map(q=>{let a=state.examAnswers[q.id],status=a==null?'Unanswered':correct(q,a)?'Correct':'Incorrect';return `<div class="reviewQuestion"><div class="sectionTag">Q${q.id} · ${status}</div><h3>${escapeHTML(q.stem)}</h3><div class="small"><b>Your answer:</b> ${escapeHTML(a??'None')} <span style="padding:0 12px">·</span> <b>Correct:</b> ${escapeHTML(q.answer)}</div><details style="margin-top:11px"><summary style="cursor:pointer;color:var(--brand);font-size:13px;font-weight:750">View bilingual rationale / 查看雙語解析</summary><p class="small">${escapeHTML(q.explanation_en)}</p><p class="small muted">${escapeHTML(q.explanation_zh)}</p></details></div>`}).join('')}`;}
function renderAnswerKey(){return header('Complete Answer Key <span class="muted">/ 標準答案</span>','All 94 correct answers in one place. Expand any item for the full bilingual academic rationale.','REFERENCE / ANSWERS')+`<div class="notice">General questions: Q1–Q70. Case questions: Q71–Q94. You can practice without opening the answer key first. 一般題 Q1–Q70；個案題 Q71–Q94。</div><div class="card" style="overflow-x:auto"><table style="border-collapse:collapse;width:100%;font-size:13px"><thead><tr style="text-align:left;border-bottom:2px solid var(--line)"><th style="padding:10px">Question</th><th>Source</th><th>Type</th><th>Correct Answer</th><th>Academic Rationale</th></tr></thead><tbody>${Q.map(q=>`<tr style="border-bottom:1px solid var(--line)"><td style="padding:12px 10px"><b>Q${q.id}</b></td><td>${q.id<=70?'Chapter '+q.group:'Case '+q.group}</td><td>${q.type==='mcq'?'MCQ':'T/F'}</td><td><b style="color:var(--brand)">${escapeHTML(q.answer)}</b></td><td><details><summary style="cursor:pointer;color:var(--brand);font-weight:730">EN / 繁中</summary><div style="max-width:590px;padding:10px 0"><p>${escapeHTML(q.explanation_en)}</p><p class="muted">${escapeHTML(q.explanation_zh)}</p></div></details></td></tr>`).join('')}</tbody></table></div><div style="margin-top:14px"><button class="btn btnPrimary" data-go="quiz">Back to Practice →</button></div>`;}
function renderAnalytics(){let s=stats(),wrong=Q.filter(q=>isAnswered(q)&&!correct(q,saved.answers[q.id])),book=Q.filter(isBookmark);return header('My Progress <span class="muted">/ 學習進度</span>','Track performance, revisit incorrect questions, and export your local study record.','PART 04 / INSIGHTS')+`<div class="cards3"><div class="card"><div class="sectionTag">COMPLETION</div><div class="metric">${s.answered}<span class="muted" style="font-size:17px;font-weight:500"> / 94</span></div><div class="progressTrack"><div class="progressFill" style="width:${s.answered/94*100}%"></div></div></div><div class="card"><div class="sectionTag">ACCURACY</div><div class="metric">${s.rate}%</div><div class="small muted">${s.correct} correct answers</div></div><div class="card"><div class="sectionTag">TO REVISIT</div><div class="metric">${wrong.length}</div><div class="small muted">Incorrect answers so far</div></div></div><div class="sectionTop"><div><h2>Performance by topic</h2><p>Accuracy is calculated from answered questions only.</p></div></div><div class="cards2">${[...CH.map(c=>({name:'Ch. '+c.id+' · '+c.title,ids:[c.id]})),{name:'Case Studies · 八篇個案',ids:CA.map(c=>c.id)}].map(g=>{let qs=Q.filter(q=>g.ids.includes(q.group)),s=stats(qs);return `<div class="card"><div class="small" style="font-weight:750">${escapeHTML(g.name)}</div><div class="metric" style="font-size:28px">${s.rate}%</div><div class="progressTrack"><div class="progressFill" style="width:${s.answered/s.total*100}%"></div></div><div class="tiny" style="margin-top:9px">${s.answered}/${s.total} answered · ${s.correct} correct · ${s.wrong} incorrect</div></div>`}).join('')}</div><div class="sectionTop"><div><h2>Review queues</h2><p>Build a focused practice session from mistakes or bookmarks.</p></div></div><div class="cards2"><div class="card"><div class="sectionTag">INCORRECT ANSWERS</div><div class="metric">${wrong.length}</div><button class="btn btnPrimary" data-queue="wrong" ${wrong.length?'':'disabled'}>Review mistakes →</button>${wrong.length?`<div class="tiny" style="margin-top:12px">${wrong.slice(0,7).map(q=>'Q'+q.id).join(' · ')}</div>`:''}</div><div class="card"><div class="sectionTag">BOOKMARKS</div><div class="metric">${book.length}</div><button class="btn btnPrimary" data-queue="bookmarks" ${book.length?'':'disabled'}>Review saved questions →</button>${book.length?`<div class="tiny" style="margin-top:12px">${book.slice(0,7).map(q=>'Q'+q.id).join(' · ')}</div>`:''}</div></div><div class="sectionTop"><div><h2>Manage study data</h2><p>Answers and unfinished exams auto-save in this browser. Export a backup to move between devices.</p></div></div><div class="card"><div class="chiprow"><button class="btn btnOutline" data-action="export">↓ Export progress as JSON</button><button class="btn btnOutline" data-action="import">↑ Import progress</button><input id="importFile" type="file" accept=".json,application/json" style="display:none"/><button class="btn btnDanger" data-action="clearall">Reset all progress</button></div><p class="tiny" style="margin-bottom:0">Export files are compatible with this website. Use them to transfer progress between browsers or computers. 清除資料後無法復原，建議先匯出備份。</p></div>`}
function applyFilters(){let grp=$('#groupFilter'),kind=$('#kindFilter'),sp=$('#specialFilter');if(!grp)return;state.filter=grp.value;state.kind=kind.value;state.special=sp.value;startSession();render()}
function chooseAnswer(v){let q=currentQ();if(!q||state.submitted||state.mode==='practice'&&saved.revealed[q.id])return;if(state.mode==='exam'){state.examAnswers[q.id]=v;}else{saved.answers[q.id]=v;save();}render()}
function processAction(action){if(action==='prev'){state.pos=Math.max(0,state.pos-1);render();return}if(action==='next'){state.pos=Math.min(state.seq.length-1,state.pos+1);render();return}if(action==='reveal'){let q=currentQ();if(q&&saved.answers[q.id]!=null){saved.revealed[q.id]=true;save();render()}return}if(action==='finish'){state.submitted=true;Object.entries(state.examAnswers).forEach(([id,v])=>saved.answers[id]=v);save();render();window.scrollTo({top:0});return}if(action==='shuffle'){state.seq=state.seq.sort(()=>Math.random()-.5);state.pos=0;state.submitted=false;render();toast('Question order shuffled');return}if(action==='restart'){startSession({reset:state.mode==='practice'});render();return}if(action==='reset-session'){if(confirm('Clear answers for all questions in this selected session?')){startSession({reset:true});render();toast('Session answers cleared')}return}if(action==='practice-wrong'){state.filter='all';state.kind='all';state.special='wrong';state.mode='practice';startSession();render();return}if(action==='resetfilters'){state.filter='all';state.kind='all';state.special='all';state.search='';startSession();render();return}if(action==='export'){let b=new Blob([JSON.stringify(saved,null,2)],{type:'application/json'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='ob-atlas-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Progress exported');return}if(action==='import'){$('#importFile')?.click();return}if(action==='clearall'){if(confirm('Permanently clear all answers, bookmarks, and reading progress from this browser?')){saved={answers:{},revealed:{},bookmarks:[],read:[],theme:saved.theme};startSession();save();render();toast('Local progress cleared')}return}}
document.addEventListener('click',ev=>{let b=ev.target.closest('button');if(!b)return;if(b.dataset.go){go(b.dataset.go);return}if(b.dataset.chapter){setChapter(b.dataset.chapter);return}if(b.dataset.case){setCase(b.dataset.case);return}if(b.dataset.lang){state.lang=b.dataset.lang;render();return}if(b.dataset.markread){let key=b.dataset.markread;saved.read=saved.read.includes(key)?saved.read.filter(x=>x!==key):[...saved.read,key];save();render();return}if(b.dataset.jump){document.getElementById(b.dataset.jump)?.scrollIntoView({behavior:'smooth',block:'start'});return}if(b.dataset.quizgroup){state.filter=b.dataset.quizgroup;state.kind='all';state.special='all';state.mode='practice';state.search='';startSession();go('quiz');return}if(b.dataset.answer){chooseAnswer(b.dataset.answer);return}if(b.dataset.pos){state.pos=Number(b.dataset.pos);render();return}if(b.dataset.bookmark){markToggle(Q.find(q=>q.id===Number(b.dataset.bookmark)));return}if(b.dataset.mode){state.mode=b.dataset.mode;startSession();render();return}if(b.dataset.queue){state.filter='all';state.kind='all';state.special=b.dataset.queue;state.mode='practice';startSession();go('quiz');return}if(b.dataset.action){processAction(b.dataset.action);return}});
document.addEventListener('change',e=>{if(['groupFilter','kindFilter','specialFilter'].includes(e.target.id)){applyFilters();return}if(e.target.id==='importFile'){let f=e.target.files?.[0];if(!f)return;f.text().then(t=>{let d=JSON.parse(t);if(!d||typeof d.answers!=='object'||!Array.isArray(d.bookmarks))throw Error('Invalid format');saved={...saved,...d};restoreSession();save();render();toast('Progress imported')}).catch(()=>alert('Import failed. Please choose a valid OB Atlas progress JSON file.'))}});
$('#themeBtn').addEventListener('click',()=>{saved.theme=saved.theme==='light'?'dark':'light';save();render()});$('#menuBtn').addEventListener('click',()=>{$('#sidebar').classList.add('open');$('#overlay').classList.add('show')});$('#overlay').addEventListener('click',()=>{$('#sidebar').classList.remove('open');$('#overlay').classList.remove('show')});
window.addEventListener('keydown',e=>{if(state.page!=='quiz'||e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;if(e.key==='ArrowRight'&&state.pos<state.seq.length-1){state.pos++;render()}if(e.key==='ArrowLeft'&&state.pos>0){state.pos--;render()}});
render();
</script>
</body>
</html>
